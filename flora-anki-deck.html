<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flora Interview Deck</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242837;
    --border: #2e3245;
    --accent: #5b8dee;
    --accent2: #7c4dff;
    --green: #4caf7d;
    --yellow: #f0b429;
    --red: #f06464;
    --text: #e8eaf6;
    --text-muted: #8891b4;
    --code-bg: #0d1117;
    --code-border: #21262d;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    gap: 12px;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    width: 100%;
    max-width: 680px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .header .meta { font-size: 13px; color: var(--text-muted); }

  /* Progress */
  .progress-bar-wrap {
    width: 100%;
    max-width: 680px;
    background: var(--surface);
    border-radius: 100px;
    height: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.3s ease;
  }
  .progress-label {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 2px;
  }
  .progress-label .cat-badge {
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--surface2);
    color: var(--text-muted);
  }
  .progress-label .cat-badge.cat-1min { background: #1a2e45; color: var(--accent); }
  .progress-label .cat-badge.cat-2min { background: #1e2a1e; color: var(--green); }
  .progress-label .cat-badge.cat-5min { background: #2a1e2a; color: #cc88ff; }
  .progress-label .cat-badge.cat-gotcha { background: #2a2018; color: var(--yellow); }

  /* Card container */
  .card-scene {
    width: 100%;
    max-width: 680px;
    perspective: 1200px;
    min-height: 340px;
  }
  .card-inner {
    position: relative;
    width: 100%;
    min-height: 340px;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 340px;
    overflow: hidden;
  }
  .card-face.back {
    transform: rotateY(180deg);
    background: var(--surface2);
    border-color: var(--accent);
    overflow-y: auto;
  }

  .card-face .face-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .card-face.back .face-label { color: var(--accent); }

  .card-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
  }
  .card-hint {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: auto;
    text-align: center;
    padding-top: 12px;
  }

  .card-body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
  }
  .card-body strong { color: #fff; }
  .card-body em { color: var(--text-muted); font-style: italic; }
  .card-body ul, .card-body ol {
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-body li { line-height: 1.6; }
  .card-body p { margin-bottom: 10px; }
  .card-body p:last-child { margin-bottom: 0; }

  /* Code blocks */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: #e6edf3;
    white-space: pre;
    tab-size: 4;
  }
  code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 4px;
    padding: 1px 5px;
    color: #79c0ff;
  }
  pre code {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
  }

  /* Syntax colors in pre */
  .kw { color: #ff7b72; }  /* keywords: def, if, for, return, from, import */
  .str { color: #a5d6ff; } /* strings */
  .cmt { color: #8b949e; font-style: italic; } /* comments */
  .num { color: #79c0ff; } /* numbers */
  .fn  { color: #d2a8ff; } /* function calls */
  .cls { color: #ffa657; } /* class/types */

  /* Tap hint */
  .tap-hint {
    position: absolute;
    bottom: 16px;
    right: 18px;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  /* Controls */
  .controls {
    width: 100%;
    max-width: 680px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    flex: 1;
    padding: 14px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); background: var(--surface2); }
  .btn.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    flex: 2;
  }
  .btn.btn-primary:active { background: #4a7de0; }
  .btn.btn-known {
    background: transparent;
    border-color: var(--green);
    color: var(--green);
  }
  .btn.btn-known:active { background: #1e2e1e; }
  .btn.btn-shuffle {
    background: transparent;
    border-color: var(--border);
    color: var(--text-muted);
    flex: 1.2;
  }

  /* Second row */
  .controls2 {
    width: 100%;
    max-width: 680px;
    display: flex;
    gap: 10px;
  }

  /* Filter bar */
  .filter-bar {
    width: 100%;
    max-width: 680px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #1a2e45;
  }
  .filter-btn:active { opacity: 0.8; }

  /* Known overlay */
  .known-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(76, 175, 125, 0.15);
    border: 2px solid var(--green);
    border-radius: var(--radius);
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.08em;
    z-index: 10;
  }
  .card-scene.is-known .known-overlay { display: flex; }

  /* Empty state */
  .empty-state {
    width: 100%;
    max-width: 680px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
  }

  /* Responsive */
  @media (min-width: 480px) {
    .card-title { font-size: 24px; }
    .card-body { font-size: 16px; }
    pre, code { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Flora Interview Deck</h1>
  <div class="meta">Apr 28 · 3 PM EDT</div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="progress-label">
  <span id="progressText">Card 1 of 52</span>
  <span class="cat-badge" id="catBadge">1-min</span>
</div>

<div class="card-scene" id="cardScene">
  <div class="card-inner" id="cardInner" onclick="flipCard()">
    <div class="card-face front" id="cardFront">
      <div class="face-label">Question</div>
      <div class="card-title" id="frontTitle"></div>
      <div class="card-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face back" id="cardBack">
      <div class="face-label">Answer</div>
      <div class="card-body" id="backBody"></div>
      <div class="tap-hint">tap to flip</div>
    </div>
    <div class="known-overlay">KNOWN ✓</div>
  </div>
</div>

<div class="controls">
  <button class="btn" onclick="prevCard()">← Prev</button>
  <button class="btn btn-primary" id="flipBtn" onclick="flipCard()">Flip</button>
  <button class="btn" onclick="nextCard()">Next →</button>
</div>

<div class="controls2">
  <button class="btn btn-known" onclick="markKnown()">Mark Known</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn btn-shuffle" onclick="resetKnown()" style="flex:1">Reset</button>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" onclick="setFilter('all')" data-filter="all">All</button>
  <button class="filter-btn" onclick="setFilter('1min')" data-filter="1min">1-min</button>
  <button class="filter-btn" onclick="setFilter('2min')" data-filter="2min">2-min</button>
  <button class="filter-btn" onclick="setFilter('5min')" data-filter="5min">5-min</button>
  <button class="filter-btn" onclick="setFilter('gotcha')" data-filter="gotcha">Gotchas</button>
</div>

<script>
// ─────────────────────────────────────────────
// CARD DATA
// ─────────────────────────────────────────────
const CARDS = [
  // ──── 1-MINUTE CARDS ────
  {
    id: "1min-1",
    category: "1min",
    front: "The 60-minute time budget — what are the phases?",
    back: `<p><strong>0–7 min:</strong> Read everything. Ask 3 clarifying questions. Don't touch the keyboard.</p>
<p><strong>7–12 min:</strong> Write your plan in comments, narrate it.</p>
<p><strong>12–35 min:</strong> Build core logic. Run tests after each function.</p>
<p><strong>35–47 min:</strong> Edge cases — empty input, nulls, malformed records.</p>
<p><strong>47–58 min:</strong> "At 10M records, here's what I'd change…"</p>
<p><strong>58–60 min:</strong> Wrap, invite their questions.</p>
<p><strong>The phase you'll skip under pressure: the clarify phase. Don't.</strong></p>`
  },
  {
    id: "1min-2",
    category: "1min",
    front: "First 5 minutes rule — what do you do before touching the keyboard?",
    back: `<p>Ask three <em>specific</em> questions before writing a line:</p>
<ul>
  <li>"Can the input be empty? Return empty list or None?"</li>
  <li>"Is timestamp epoch int or ISO string?"</li>
  <li>"Does 'successful' mean 200 exactly or 2xx range?"</li>
</ul>
<p><strong>Evaluators watch for this. It's the single biggest signal of senior thinking.</strong></p>
<p>Not "are there edge cases?" — that's too vague. Be specific.</p>`
  },
  {
    id: "1min-3",
    category: "gotcha",
    front: "Python gotcha: json.load vs json.loads — which is which?",
    back: `<p><code>json.load(f)</code> → takes a <strong>file object</strong> (use inside <code>with open(...)</code>)</p>
<p><code>json.loads(s)</code> → takes a <strong>string</strong></p>
<pre><span class="kw">with</span> open(<span class="str">'data.json'</span>) <span class="kw">as</span> f:
    data = json.<span class="fn">load</span>(f)       <span class="cmt"># FILE</span>
data = json.<span class="fn">loads</span>(<span class="str">'{"k":1}'</span>)  <span class="cmt"># STRING</span></pre>
<p><strong>You've mixed these up under stress before. Say it once before you type it.</strong></p>`
  },
  {
    id: "1min-4",
    category: "gotcha",
    front: "Python gotcha: collections imports — name the four you'll need",
    back: `<pre><span class="kw">from</span> collections <span class="kw">import</span> defaultdict, Counter, deque, OrderedDict</pre>
<ul>
  <li><strong>defaultdict(list)</strong> → grouping</li>
  <li><strong>deque</strong> → sliding windows (O(1) pop from left)</li>
  <li><strong>Counter</strong> → frequency counting</li>
  <li><strong>OrderedDict</strong> → insertion-order dict (Python 3.7+ dicts are ordered anyway)</li>
</ul>
<p>No external libraries. Only stdlib. This is your toolbox.</p>`
  },
  {
    id: "1min-5",
    category: "1min",
    front: "The grouping pattern — write it from memory",
    back: `<pre>groups = <span class="fn">defaultdict</span>(list)
<span class="kw">for</span> r <span class="kw">in</span> records:
    groups[r[<span class="str">'key'</span>]].<span class="fn">append</span>(r)</pre>
<p><strong>This is the skeleton of 80% of Systems-Data problems.</strong> Memorize the shape.</p>
<p>After grouping: sort within each group, or compute an aggregate. That's it.</p>
<p>Applies to: log parsing, event pipelines, asset grouping, rate detection — all of these.</p>`
  },
  {
    id: "1min-6",
    category: "1min",
    front: "The sliding window pattern (deque) — write the core loop",
    back: `<pre>window = <span class="fn">deque</span>()
<span class="kw">for</span> ts <span class="kw">in</span> sorted_timestamps:
    window.<span class="fn">append</span>(ts)
    <span class="kw">while</span> window <span class="kw">and</span> ts - window[<span class="num">0</span>] &gt; WINDOW_SIZE:
        window.<span class="fn">popleft</span>()
    <span class="kw">if</span> <span class="fn">len</span>(window) &gt; THRESHOLD:
        <span class="kw">pass</span>  <span class="cmt"># violation</span></pre>
<p><strong>Evict from the left, grow from the right. That's the whole move.</strong></p>
<p>Use case: rate-limiting, abuse detection, sliding time windows.</p>`
  },
  {
    id: "1min-7",
    category: "1min",
    front: "Trade-off narration template — what do you say when making a data structure choice?",
    back: `<p><strong>"I'm using [X] here — that's O(Y). If we needed real-time instead of batch, I'd switch to [Z]."</strong></p>
<p>Examples:</p>
<ul>
  <li>sorted list → "O(n log n). Fine for batch."</li>
  <li>defaultdict → "O(1) lookup on insert. Better than scanning a list."</li>
  <li>deque → "O(1) pop from left. Lists would be O(n)."</li>
</ul>
<p>Evaluators are listening for reasoning, not just output.</p>`
  },
  {
    id: "1min-8",
    category: "1min",
    front: "Run code early — what's the move after each helper function?",
    back: `<p><strong>After every helper function, run it with a tiny test case before moving on.</strong></p>
<pre><span class="cmt"># Quick sanity check before I continue</span>
<span class="fn">print</span>(<span class="fn">parse_events</span>([{<span class="str">"job_id"</span>: <span class="str">"1"</span>, <span class="str">"event"</span>: <span class="str">"QUEUED"</span>, <span class="str">"ts"</span>: <span class="num">100</span>}]))</pre>
<p>Don't wait for "done." Test iteratively — bugs caught at 15 min are free. Bugs caught at 50 min are fatal.</p>`
  },
  {
    id: "1min-9",
    category: "gotcha",
    front: "Safe dict access — how do you avoid KeyError on unknown input?",
    back: `<pre><span class="cmt"># Always .get() with a fallback</span>
value = record.<span class="fn">get</span>(<span class="str">'field'</span>, default_value)

<span class="cmt"># Safe nested access (handles missing metadata entirely)</span>
nested = record.<span class="fn">get</span>(<span class="str">'metadata'</span>, {}).<span class="fn">get</span>(<span class="str">'width'</span>)</pre>
<p><strong>Never index directly into a dict from unknown input.</strong> Always <code>.get()</code> with a fallback.</p>
<p>If <code>metadata</code> is missing entirely, <code>.get('metadata', {})</code> returns <code>{}</code> and the second <code>.get('width')</code> returns <code>None</code> safely.</p>`
  },
  {
    id: "1min-10",
    category: "1min",
    front: '"Check before you optimize" — what do you say after core implementation?',
    back: `<p><strong>"Before I add edge-case handling, does the basic approach look right to you?"</strong></p>
<p>This does two things:</p>
<ol>
  <li>Prevents polishing the wrong solution</li>
  <li>Signals collaborative instinct — important for a senior role on a 50-person team</li>
</ol>
<p>One human is watching. Use them.</p>`
  },
  {
    id: "1min-11",
    category: "1min",
    front: '"Systems-Data" — what does each word actually mean?',
    back: `<p><strong>"Data"</strong> = structured records, JSON/CSV, grouping, filtering, timestamps, missing fields.</p>
<p><strong>"Systems"</strong> = state across records, ordering concerns, volume/scale nudges, trade-off questions.</p>
<p><strong>NOT Leetcode hard. NOT trees or graphs. NOT DP.</strong></p>
<p>If the problem looks like abstract algorithm work, slow down and reframe it as a data problem.</p>
<p>Reframing the problem correctly is half the score.</p>`
  },
  {
    id: "1min-12",
    category: "1min",
    front: "If you're behind at the 35-min mark — what's the senior move?",
    back: `<p><strong>Say it out loud: "I'm going to skip error-handling for now and come back if there's time."</strong></p>
<p>Don't silently cut corners. Narrating the trade-off scores better than silent omission.</p>
<p>Then:</p>
<ol>
  <li>Finish core logic</li>
  <li>Name what's missing</li>
  <li>Move to edge cases you CAN hit</li>
</ol>
<p>Senior engineers communicate under pressure. This is the senior move.</p>`
  },
  {
    id: "1min-13",
    category: "gotcha",
    front: "Sorting syntax — single key and multi-key, write both",
    back: `<pre><span class="cmt"># Single key</span>
<span class="fn">sorted</span>(items, key=<span class="kw">lambda</span> x: x[<span class="str">'score'</span>], reverse=<span class="kw">True</span>)

<span class="cmt"># Multi-key (group asc, score desc)</span>
<span class="fn">sorted</span>(items, key=<span class="kw">lambda</span> x: (x[<span class="str">'group'</span>], -x[<span class="str">'score'</span>]))</pre>
<p><strong>The lambda syntax is what trips people up.</strong> Write it once in your warm-up block.</p>
<p>Every aggregation problem ends with a sort.</p>`
  },
  {
    id: "1min-14",
    category: "gotcha",
    front: "Python gotcha: sorted() vs .sort() — what's the key difference?",
    back: `<p><code>sorted(items)</code> → returns a <strong>new list</strong>, original unchanged.</p>
<p><code>items.sort()</code> → mutates in place, <strong>returns None</strong>.</p>
<p><strong>Common trap:</strong></p>
<pre>result = items.<span class="fn">sort</span>()  <span class="cmt"># result is None!</span>
<span class="fn">print</span>(result)           <span class="cmt"># None — not what you wanted</span></pre>
<p>Use <code>sorted()</code> in almost all interview contexts unless you explicitly want mutation.</p>`
  },
  {
    id: "1min-15",
    category: "1min",
    front: '"Why Flora?" — one-sentence version',
    back: `<p><strong>"I'm drawn to tools that make experts more powerful rather than replacing them — FAUNA's model-agnostic approach is the right framing for this moment. And I want to be somewhere where I'm actually building."</strong></p>
<p>Don't over-explain. Deliver it, move on. The coding is the real answer.</p>`
  },

  // ──── 2-MINUTE CARDS ────
  {
    id: "2min-1",
    category: "2min",
    front: "The clarifying-questions framework — 5 categories, pick the 3 most relevant",
    back: `<ol>
  <li><strong>Input shape:</strong> "What format is the input — file, list, stdin? JSON or CSV?"</li>
  <li><strong>Output contract:</strong> "What should I return — a dict, a list, print to stdout?"</li>
  <li><strong>Edge case pre-flight:</strong> "Can the input be empty? Duplicate IDs? Out-of-order events?"</li>
  <li><strong>Domain ambiguity:</strong> "Does 'successful' mean 200 or 2xx? Can a job have multiple STARTED events?"</li>
  <li><strong>Volume signal:</strong> "You mentioned 10M records — optimize for memory, or is batch fine?"</li>
</ol>
<p>Don't ask all five. Pick the three most relevant. The goal is to signal you think before you code — not to interrogate them.</p>`
  },
  {
    id: "2min-2",
    category: "2min",
    front: "Write your plan in comments first — what does the comment block look like?",
    back: `<pre><span class="cmt"># Plan:</span>
<span class="cmt"># 1. Parse input into list of dicts</span>
<span class="cmt"># 2. Group events by job_id using defaultdict</span>
<span class="cmt"># 3. For each job, compute duration if both QUEUED and COMPLETED present</span>
<span class="cmt"># 4. Return average</span></pre>
<p>Say out loud: <strong>"I'm going to write my plan first so we're aligned before I dive in."</strong></p>
<p>This is not wasted time — it does three things: catches design flaws early, shows reasoning structure, gives you a checklist.</p>
<p>If your plan is wrong, you want them to redirect you NOW — not at minute 40.</p>`
  },
  {
    id: "2min-3",
    category: "2min",
    front: "Event pipeline pattern — state machine in a dict (with code)",
    back: `<pre>job_times = <span class="fn">defaultdict</span>(dict)
<span class="kw">for</span> event <span class="kw">in</span> events:

stats = <span class="fn">defaultdict</span>(<span class="kw">lambda</span>: {<span class="str">'count'</span>: <span class="num">0</span>, <span class="str">'total'</span>: <span class="num">0</span>})</pre>
<p>Use <code>defaultdict</code> when building accumulators in a loop. Use regular dict when you want KeyError to signal missing data.</p>`
  },
  {
    id: "gotcha-5",
    category: "gotcha",
    front: "Dict comprehension — common patterns",
    back: `<pre><span class="cmt"># From list of tuples</span>
d = {k: v <span class="kw">for</span> k, v <span class="kw">in</span> pairs}

<span class="cmt"># Compute aggregate per group</span>
averages = {
    ep: <span class="fn">sum</span>(d) / <span class="fn">len</span>(d)
    <span class="kw">for</span> ep, d <span class="kw">in</span> endpoint_durations.<span class="fn">items</span>()
}

<span class="cmt"># Filter + transform</span>
result = {
    k: v <span class="kw">for</span> k, v <span class="kw">in</span> data.<span class="fn">items</span>()
    <span class="kw">if</span> v <span class="kw">is not None</span>
}</pre>
<p>Dict comprehension at the end of an aggregation pipeline is where people make mistakes under pressure. <strong>Write it out longhand if needed — correctness over cleverness.</strong></p>`
  }
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let allCards = [...CARDS];
let deck = [...CARDS];
let currentIdx = 0;
let isFlipped = false;
let knownSet = new Set();
let currentFilter = 'all';

function buildDeck() {
  deck = allCards.filter(c => {
    if (knownSet.has(c.id)) return false;
    if (currentFilter === 'all') return true;
    return c.category === currentFilter;
  });
  if (deck.length === 0) {
    // Show all in the filter even if known
    deck = allCards.filter(c => {
      if (currentFilter === 'all') return true;
      return c.category === currentFilter;
    });
  }
}

function renderCard() {
  if (deck.length === 0) {
    document.getElementById('cardScene').style.display = 'none';
    return;
  }
  document.getElementById('cardScene').style.display = '';
  const card = deck[currentIdx];
  if (!card) { currentIdx = 0; }
  const c = deck[currentIdx];

  document.getElementById('frontTitle').textContent = c.front;
  document.getElementById('backBody').innerHTML = c.back;

  // Reset flip
  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');

  // Progress
  const total = deck.length;
  const pos = currentIdx + 1;
  document.getElementById('progressText').textContent = `Card ${pos} of ${total}`;
  const pct = Math.round((pos / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';

  // Category badge
  const badge = document.getElementById('catBadge');
  const catMap = { '1min': '1-min', '2min': '2-min', '5min': '5-min', 'gotcha': 'Gotcha' };
  badge.textContent = catMap[c.category] || c.category;
  badge.className = 'cat-badge cat-' + c.category;

  // Known indicator
  const scene = document.getElementById('cardScene');
  if (knownSet.has(c.id)) {
    scene.classList.add('is-known');
  } else {
    scene.classList.remove('is-known');
  }
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  currentIdx = (currentIdx + 1) % deck.length;
  renderCard();
}

function prevCard() {
  currentIdx = (currentIdx - 1 + deck.length) % deck.length;
  renderCard();
}

function shuffle() {
  // Fisher-Yates
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIdx = 0;
  renderCard();
}

function markKnown() {
  const card = deck[currentIdx];
  if (!card) return;
  if (knownSet.has(card.id)) {
    knownSet.delete(card.id);
  } else {
    knownSet.add(card.id);
  }
  renderCard();
}

function resetKnown() {
  knownSet.clear();
  buildDeck();
  currentIdx = 0;
  renderCard();
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  buildDeck();
  currentIdx = 0;
  renderCard();
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'n') nextCard();
  else if (e.key === 'ArrowLeft' || e.key === 'p') prevCard();
  else if (e.key === ' ' || e.key === 'f') { e.preventDefault(); flipCard(); }
  else if (e.key === 'k') markKnown();
  else if (e.key === 's') shuffle();
});

// Swipe support
let touchStartX = 0;
document.getElementById('cardScene').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });
document.getElementById('cardScene').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) nextCard();
    else prevCard();
  }
}, { passive: true });

// Init
buildDeck();
renderCard();
</script>
