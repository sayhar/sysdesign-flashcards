<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Flashcards</title>
<style>
:root {
  --bg: #f7f7f8; --card-bg: #ffffff; --text: #1a1a1a; --subtext: #666;
  --border: #e2e2e2; --accent: #4f46e5; --accent-light: #ede9fe;
  --again: #ef4444; --hard: #f97316; --good: #22c55e; --easy: #3b82f6;
  --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10; --card-bg: #1c1c1e; --text: #f0f0f0; --subtext: #999;
    --border: #2c2c2e; --accent: #818cf8; --accent-light: #1e1b4b;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; min-height: 100vh; }
#app { max-width: 600px; margin: 0 auto; padding: 16px; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 16px; }
.header h1 { font-size: 20px; font-weight: 700; }
.header .stats { font-size: 14px; color: var(--subtext); }
.screen { display: none; }
.screen.active { display: block; }
.section-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.filter-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 14px; cursor: pointer; transition: all 0.15s; }
.filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.deck-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.section-card { background: var(--card-bg); border-radius: var(--radius); border: 1.5px solid var(--border); padding: 14px 16px; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); }
.section-card:hover { border-color: var(--accent); }
.section-card h3 { font-size: 15px; font-weight: 600; }
.section-card .meta { font-size: 13px; color: var(--subtext); margin-top: 4px; }
.start-btn { width: 100%; padding: 16px; border-radius: var(--radius); background: var(--accent); color: white; font-size: 17px; font-weight: 600; border: none; cursor: pointer; margin-bottom: 12px; }
.start-btn:disabled { opacity: 0.5; cursor: default; }
.btn-outline { padding: 14px; border-radius: var(--radius); border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; }
.btn-secondary { padding: 14px; border-radius: var(--radius); border: 1.5px solid var(--border); background: transparent; color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; }
.landing-actions { display: flex; flex-direction: column; gap: 0; margin-bottom: 24px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card-bg); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 16px; width: 100%; max-height: 80vh; overflow-y: auto; }
.modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.modal p { font-size: 14px; color: var(--subtext); margin-bottom: 16px; }
.tag-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.tag-btn { padding: 10px 16px; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.tag-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
.tag-btn.featured { border-color: var(--accent); color: var(--accent); }
.modal-close { padding: 12px; border-radius: var(--radius); border: 1.5px solid var(--border); background: transparent; color: var(--subtext); font-size: 15px; cursor: pointer; width: 100%; }
.sim-option { background: var(--card-bg); border-radius: var(--radius); border: 1.5px solid var(--border); padding: 16px; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); margin-bottom: 10px; }
.sim-option:hover { border-color: var(--accent); }
.sim-option h3 { font-size: 15px; font-weight: 600; }
.sim-option .meta { font-size: 13px; color: var(--subtext); margin-top: 4px; }
.progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.phase-label { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; min-height: 18px; }
.card-container { background: var(--card-bg); border-radius: var(--radius); border: 1.5px solid var(--border); box-shadow: var(--shadow); min-height: 240px; padding: 24px; margin-bottom: 16px; display: flex; flex-direction: column; }
.card-section { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
.card-front { font-size: 20px; font-weight: 600; line-height: 1.4; flex: 1; }
.card-back { display: none; margin-top: 20px; padding-top: 20px; border-top: 1.5px solid var(--border); font-size: 15px; line-height: 1.6; color: var(--text); white-space: pre-line; }
.card-back.visible { display: block; }
.show-btn { width: 100%; padding: 14px; border-radius: var(--radius); background: var(--accent); color: white; font-size: 17px; font-weight: 600; border: none; cursor: pointer; margin-bottom: 12px; }
.rating-row { display: none; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.rating-row.visible { display: grid; }
.rate-btn { padding: 14px 4px; border-radius: var(--radius); border: none; color: white; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.rate-btn .label { font-size: 11px; font-weight: 400; opacity: 0.85; }
.rate-again { background: var(--again); } .rate-hard { background: var(--hard); } .rate-good { background: var(--good); } .rate-easy { background: var(--easy); }
.counter { font-size: 13px; color: var(--subtext); text-align: center; margin-top: 12px; }
.mode-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.mode-badge.drill { background: #fef3c7; color: #92400e; }
.mode-badge.sim { background: #dcfce7; color: #166534; }
@media (prefers-color-scheme: dark) {
  .mode-badge.drill { background: #78350f; color: #fde68a; }
  .mode-badge.sim { background: #14532d; color: #86efac; }
}
.draw-actions { display: flex; gap: 10px; margin-top: 16px; }
.draw-btn { flex: 1; padding: 14px; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
.draw-sketched { background: var(--accent); color: white; }
.draw-skip { background: var(--border); color: var(--text); }
.draw-diagram { margin-top: 16px; overflow-x: auto; }
.draw-diagram svg { display: block; max-width: 100%; }
.done-screen { text-align: center; padding: 40px 16px; }
.done-screen h2 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
.done-screen p { color: var(--subtext); margin-bottom: 16px; font-size: 16px; }
.done-actions { display: flex; flex-direction: column; gap: 10px; }
.sim-summary { background: var(--card-bg); border-radius: var(--radius); border: 1.5px solid var(--border); padding: 16px; margin-bottom: 20px; text-align: left; }
.sim-summary h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.sim-stat { font-size: 14px; color: var(--subtext); margin-bottom: 4px; }
.sim-highlight { font-size: 14px; margin-top: 12px; padding: 10px; background: var(--accent-light); border-radius: 8px; color: var(--text); }
.learn-more { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--subtext); text-decoration: none; }
.learn-more:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>System Design</h1>
    <div class="stats" id="headerStats"></div>
  </div>
  <div class="screen active" id="landing">
    <div class="section-filters" id="sectionFilters"></div>
    <div class="deck-list" id="deckList"></div>
    <div class="landing-actions">
      <button class="start-btn" id="startBtn" onclick="startSession()">Start Review</button>
      <button class="btn-outline" onclick="openDrillModal()">Drill by Tag</button>
      <button class="btn-secondary" onclick="showSimPicker()">Interview Simulator</button>
    </div>
  </div>
  <div class="modal-overlay" id="drillModal">
    <div class="modal">
      <h2>Drill by Tag</h2>
      <p>Pick a tag to review all matching cards, ignoring due dates.</p>
      <div class="tag-grid" id="tagGrid"></div>
      <button class="modal-close" onclick="closeDrillModal()">Cancel</button>
    </div>
  </div>
  <div class="screen" id="simPicker">
    <h2 style="font-size:20px;font-weight:700;margin-bottom:4px;">Interview Simulator</h2>
    <p style="font-size:14px;color:var(--subtext);margin-bottom:20px;">Rehearsal mode — ratings won't affect your scheduling.</p>
    <div id="simList"></div>
    <button class="btn-outline" onclick="showLanding()" style="margin-top:8px;">Back</button>
  </div>
  <div class="screen" id="study">
    <div class="mode-badge" id="modeBadge" style="display:none"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="phase-label" id="phaseLabel"></div>
    <div class="card-container" id="cardContainer">
      <div class="card-section" id="cardSection"></div>
      <div class="card-front" id="cardFront"></div>
      <div class="card-back" id="cardBack"></div>
      <div class="draw-actions" id="drawActions" style="display:none">
        <button class="draw-btn draw-sketched" onclick="revealDrawCard()">I've sketched it</button>
        <button class="draw-btn draw-skip" onclick="skipDrawCard()">Skip</button>
      </div>
      <div class="draw-diagram" id="drawDiagram" style="display:none"></div>
    </div>
    <button class="show-btn" id="showBtn" onclick="showAnswer()">Show Answer</button>
    <div class="rating-row" id="ratingRow">
      <button class="rate-btn rate-again" onclick="rate('again')">Again<span class="label">&lt;1d</span></button>
      <button class="rate-btn rate-hard" onclick="rate('hard')">Hard<span class="label">~1d</span></button>
      <button class="rate-btn rate-good" onclick="rate('good')">Good<span class="label">interval+</span></button>
      <button class="rate-btn rate-easy" onclick="rate('easy')">Easy<span class="label">long</span></button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="screen" id="done">
    <div class="done-screen">
      <h2 id="doneTitle"></h2>
      <p id="doneSubtitle"></p>
      <div id="simSummaryBlock"></div>
      <div class="done-actions">
        <button class="start-btn" id="keepGoingBtn" onclick="keepGoing()">Keep Going</button>
        <button class="btn-outline" onclick="showLanding()">Back to Deck</button>
      </div>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY = 'sysdesign-flashcards-progress-v1';
const CARDS = [
  // SECTION 1 — FUNDAMENTALS
  {id:"f01",section:"Fundamentals",tags:["scalability"],front:"What are the three guarantees of CAP theorem, and why can you only pick two?",back:"Consistency (every read sees the latest write), Availability (every request gets a response), Partition Tolerance (the system works despite network splits).\n\nYou can only pick two because during a network partition you must choose: return a potentially stale response (AP) or refuse to respond at all (CP). A CA system doesn't exist in practice — partitions happen.",source_url:"https://github.com/donnemartin/system-design-primer#cap-theorem"},
  {id:"f02",section:"Fundamentals",tags:["scalability"],front:"CP vs AP: give one database example of each and why.",back:"CP: HBase, ZooKeeper — they halt or return errors during a partition rather than serve stale data. Good for banking, inventory counts.\n\nAP: Cassandra, DynamoDB (by default) — they return the best answer they have and resolve conflicts later. Good for shopping carts, social feeds.",source_url:"https://github.com/donnemartin/system-design-primer#cap-theorem"},
  {id:"f03",section:"Fundamentals",tags:["scalability"],front:"What is BASE, and how does it contrast with ACID?",back:"BASE: Basically Available, Soft state, Eventually consistent.\nACID: Atomicity, Consistency, Isolation, Durability.\n\nACID = strong guarantees, typically relational DBs, single-node transactions.\nBASE = looser guarantees, NoSQL distributed systems. BASE trades correctness for availability and performance.",source_url:"https://github.com/donnemartin/system-design-primer#availability-vs-consistency"},
  {id:"f04",section:"Fundamentals",tags:["scalability"],front:"What are the ACID properties, and which is hardest to achieve in a distributed system?",back:"Atomicity: all-or-nothing.\nConsistency: DB transitions between valid states.\nIsolation: concurrent transactions don't see each other's partial state.\nDurability: committed writes survive crashes.\n\nIsolation is hardest distributed (requires coordination). Atomicity is solved by 2PC, but 2PC is slow.",source_url:"https://en.wikipedia.org/wiki/ACID"},
  {id:"f05",section:"Fundamentals",tags:["scalability"],front:"Latency numbers: order these from fastest to slowest — L1 cache, disk seek, SSD read, RAM access, network round-trip (same datacenter), network round-trip (cross-continent).",back:"L1 cache: ~1 ns\nRAM: ~100 ns\nSSD read: ~100 μs\nDisk seek: ~10 ms\nSame-DC round-trip: ~0.5 ms\nCross-continent: ~150 ms\n\nKey ratios: RAM is 1000x faster than SSD. SSD is 100x faster than disk. These bound every design decision about caching.",source_url:"https://github.com/donnemartin/system-design-primer#latency-numbers-every-programmer-should-know"},
  {id:"f06",section:"Fundamentals",tags:["scalability","storage"],front:"What is strong consistency vs eventual consistency? Give an example of when each is required.",back:"Strong/linearizability: after a write, all reads return that value immediately. Required for: bank balance, seat inventory, leader election.\n\nEventual consistency: replicas converge given no new writes — but reads may temporarily be stale. Fine for: social media likes, DNS records, shopping cart.",source_url:"https://github.com/donnemartin/system-design-primer#consistency-patterns"},
  {id:"f07",section:"Fundamentals",tags:["scalability"],front:"What is causal consistency, and when does it matter more than eventual consistency?",back:"Causal consistency guarantees that operations causally related appear in causal order to all readers — but concurrent operations may be seen in any order.\n\nMatters when: posting a reply should not appear before the original post. Causal is weaker than linearizability but stronger than eventual.",source_url:"https://github.com/donnemartin/system-design-primer#consistency-patterns"},
  {id:"f08",section:"Fundamentals",tags:["storage"],front:"What is a write-ahead log (WAL) and why do databases use it?",back:"A WAL records every intended change before applying it to the data file. On crash, the DB replays the log to recover.\n\nWhy: fsync to a sequential log is faster than random writes to a B-tree. Ensures durability (ACID-D) without expensive full-page flushes.",source_url:"https://en.wikipedia.org/wiki/Write-ahead_logging"},
  {id:"f09",section:"Fundamentals",tags:["scalability"],front:"What is the difference between throughput and latency? Why does optimizing one often hurt the other?",back:"Throughput: requests/second the system handles.\nLatency: time to complete a single request.\n\nConflict: batching increases throughput (amortize overhead) but adds latency per item. Parallelism increases throughput but can cause contention. Caching reduces latency but may reduce write throughput due to invalidation.",source_url:"https://github.com/donnemartin/system-design-primer#latency-vs-throughput"},
  {id:"f10",section:"Fundamentals",tags:["scalability","clay"],front:"What is idempotency, and why is it critical in distributed systems?",back:"An operation is idempotent if applying it multiple times yields the same result as once. Critical because networks cause duplicate delivery — if your payment handler isn't idempotent, retries charge twice.\n\nImplementation: idempotency key (UUID from client), server deduplicates by storing processed keys."},
  {id:"f11",section:"Fundamentals",tags:["scalability"],front:"What is a race condition, and name two ways to prevent them in a distributed system.",back:"A race condition is when the outcome depends on the order of concurrent operations in a way that produces incorrect results.\n\nPrevention:\n1. Optimistic locking — compare-and-swap (CAS), retry on conflict\n2. Pessimistic locking — acquire lock before read-modify-write (slow under contention)"},
  {id:"f12",section:"Fundamentals",tags:["scalability","storage"],front:"What is the difference between synchronous and asynchronous replication, and when do you pick each?",back:"Sync: leader waits for replica to confirm write before returning to client. Durable, but adds latency and blocks if replica is slow.\n\nAsync: leader returns immediately; replica lags. Faster, but you can lose writes if leader crashes before replica catches up.\n\nPick: sync for financial data; async for read replicas serving analytics."},

  // SECTION 2 — SCALABILITY PATTERNS
  {id:"s01",section:"Scalability Patterns",tags:["scalability"],front:"What is the difference between horizontal and vertical scaling? What are the limits of each?",back:"Vertical (scale up): bigger machine — more CPU/RAM. Simple, no code changes. Hard limit: largest machine available; SPOF; expensive.\n\nHorizontal (scale out): more machines behind a load balancer. Theoretically unlimited. Requires stateless services or shared state management.",source_url:"https://github.com/donnemartin/system-design-primer#horizontal-scaling"},
  {id:"s02",section:"Scalability Patterns",tags:["scalability","storage"],front:"What is consistent hashing, and what problem does it solve?",back:"Consistent hashing maps keys and nodes to a ring. Each key goes to the first node clockwise from its position.\n\nProblem solved: when you add/remove nodes in naive mod-N hashing, N changes → almost all keys remap (thundering herd, cache invalidation). With consistent hashing, only K/N keys move (K=keys, N=nodes).",source_url:"https://en.wikipedia.org/wiki/Consistent_hashing"},
  {id:"s03",section:"Scalability Patterns",tags:["scalability"],front:"What are virtual nodes in consistent hashing, and why use them?",back:"Each physical node owns multiple positions on the ring. Benefit: distributes load more evenly when machines differ in capacity, and spreads rebalancing load across many nodes when one is removed.\n\nWithout vnodes: one departing node dumps all its load on one neighbor.",source_url:"https://en.wikipedia.org/wiki/Consistent_hashing"},
  {id:"s04",section:"Scalability Patterns",tags:["scalability","storage"],front:"What is database sharding, and what are the three common sharding strategies?",back:"Sharding splits data across multiple DB instances (shards) so no single machine holds all data.\n\n1. Range sharding: shard by key range (simple, hot spots on sequential keys)\n2. Hash sharding: shard = hash(key) % N (even distribution, hard to range scan)\n3. Directory sharding: lookup table maps key → shard (flexible, extra lookup overhead)",source_url:"https://github.com/donnemartin/system-design-primer#database"},
  {id:"s05",section:"Scalability Patterns",tags:["scalability","storage"],front:"What are the main downsides of database sharding?",back:"1. Cross-shard JOINs require application-level joins (slow, complex)\n2. Distributed transactions are hard (2PC needed)\n3. Hotspots if shard key is poorly chosen\n4. Re-sharding when a shard grows is painful\n5. Operational complexity multiplied by N",source_url:"https://github.com/donnemartin/system-design-primer#database"},
  {id:"s06",section:"Scalability Patterns",tags:["scalability","storage"],front:"What is database replication, and what are the main topologies?",back:"Copies data from primary to replicas.\n\nTopologies:\n- Single-leader: one write master, N read replicas (most common)\n- Multi-leader: any node accepts writes, conflict resolution needed\n- Leaderless (Dynamo): quorum W+R > N for consistency",source_url:"https://github.com/donnemartin/system-design-primer#replication"},
  {id:"s07",section:"Scalability Patterns",tags:["scalability","storage"],front:"In leader/replica replication, what is replication lag, and why does it matter?",back:"Replication lag is the delay between a write on the leader and its appearance on a replica. During lag, reads from replicas are stale.\n\nMatters for: read-your-writes consistency (user posts then immediately reads — may see old state). Fix: route reads to leader for a short window after a user's own writes.",source_url:"https://github.com/donnemartin/system-design-primer#replication"},
  {id:"s08",section:"Scalability Patterns",tags:["scalability","storage"],front:"What is a read replica, and what problem does it solve?",back:"A read replica receives asynchronous copies of the primary's writes and handles read traffic only.\n\nSolves: read-heavy workloads (analytics, dashboards) that would overwhelm a single primary. Doesn't help write throughput.",source_url:"https://github.com/donnemartin/system-design-primer#replication"},
  {id:"s09",section:"Scalability Patterns",tags:["scalability"],front:"What is a connection pool, and why is it important at scale?",back:"Reuses a set of open DB connections instead of opening one per request.\n\nDB connections are expensive (TCP handshake, auth, memory). Without pooling, 10K concurrent requests = 10K connections → DB crashes."},
  {id:"s10",section:"Scalability Patterns",tags:["scalability"],front:"Explain the thundering herd problem and two ways to prevent it.",back:"Cache expiry or restart causes many simultaneous misses → DB gets slammed.\n\nPrevention:\n1. Cache lock/mutex: one request populates; others wait\n2. Probabilistic early expiration: pre-warm before TTL"},
  {id:"s11",section:"Scalability Patterns",tags:["scalability"],front:"What is a CDN and when should you use one?",back:"Caches static assets at edge nodes close to users.\n\nUse for: images, JS, CSS, video; global, read-heavy, offload origin.\n\nNot useful for: highly dynamic, user-specific, or real-time data.",source_url:"https://github.com/donnemartin/system-design-primer#content-delivery-network"},
  {id:"s12",section:"Scalability Patterns",tags:["scalability"],front:"What are the four main types of load balancers and when do you use each?",back:"L4 (transport): routes by IP/TCP port — fast, no content awareness. Good for raw throughput.\nL7 (application): routes by URL, headers, cookies — enables path-based routing, sticky sessions, SSL termination.\nDNS round-robin: cheapest, no health checks.\nGlobal LB: routes by geography (Anycast, GSLB).",source_url:"https://github.com/donnemartin/system-design-primer#load-balancer"},
  {id:"s13",section:"Scalability Patterns",tags:["scalability"],front:"What is the difference between active-active and active-passive failover?",back:"Active-active: all nodes handle traffic simultaneously. Failure → load shifts to remaining nodes. Higher throughput, no wasted standby capacity.\n\nActive-passive: primary handles all traffic; standby waits. Failure → promote standby. Simpler, but wasteful and has failover delay (seconds to minutes).",source_url:"https://github.com/donnemartin/system-design-primer#availability-patterns"},

  // SECTION 3 — STORAGE & DATABASES
  {id:"db01",section:"Storage & Databases",tags:["storage"],front:"What is the difference between a B-tree and an LSM tree? Which should you use for write-heavy workloads?",back:"B-tree: in-place updates, O(log N) reads. Each write may touch multiple pages (write amplification).\n\nLSM: append-only to memtable → SSTables → background merge. Very fast writes, read amplification. Use LSM for write-heavy: Cassandra, RocksDB, LevelDB.",source_url:"https://en.wikipedia.org/wiki/Log-structured_merge-tree"},
  {id:"db02",section:"Storage & Databases",tags:["storage"],front:"What is write amplification and read amplification in storage engines?",back:"Write amplification: one logical write causes multiple physical writes (compaction in LSM, COW pages in B-tree). Measured as ratio of physical to logical bytes.\n\nRead amplification: one logical read requires multiple physical reads (multiple SSTable levels in LSM). B-trees have lower read amplification than LSM.",source_url:"https://en.wikipedia.org/wiki/Log-structured_merge-tree"},
  {id:"db03",section:"Storage & Databases",tags:["storage"],front:"When should you choose SQL vs NoSQL?",back:"SQL: structured data, complex queries, ACID transactions, strong schema, joins needed. E.g., financial records, user accounts.\n\nNoSQL: flexible schema, massive scale, simple access patterns, document/graph/time-series data. E.g., product catalog (document), social graph (graph DB), metrics (TSDB).\n\nDefault to SQL. Add NoSQL when you have a specific need it addresses.",source_url:"https://github.com/donnemartin/system-design-primer#sql-or-nosql"},
  {id:"db04",section:"Storage & Databases",tags:["storage"],front:"What is denormalization, and when is it worth the cost?",back:"Duplicate data to reduce joins (e.g., store user_name in posts instead of joining to users).\n\nWorth it when: reads far outnumber writes, joins are expensive, eventual consistency is tolerable.\nCost: update anomalies, dual writes.",source_url:"https://github.com/donnemartin/system-design-primer#relational-database-management-system-rdbms"},
  {id:"db05",section:"Storage & Databases",tags:["storage"],front:"What are the four main NoSQL database types? Give an example of each and its use case.",back:"Key-value: Redis, DynamoDB — session store, cache, rate limiting.\nDocument: MongoDB, Firestore — product catalog, user profiles with variable fields.\nColumn-family: Cassandra, HBase — time-series, write-heavy analytics, wide rows.\nGraph: Neo4j — social graph, fraud detection, recommendation systems.",source_url:"https://github.com/donnemartin/system-design-primer#nosql"},
  {id:"db06",section:"Storage & Databases",tags:["storage","clay","identity-resolution"],front:"What is a Bloom filter, and where is it used in storage systems?",back:"A Bloom filter is a probabilistic data structure that answers 'definitely not present' or 'maybe present' in O(1) with very low false-positive rate.\n\nUsed in: LSM trees to avoid disk lookups for keys definitely not in an SSTable; BigTable; Cassandra read path. Also useful for: dedup in Clay-style enrichment pipelines.",source_url:"https://en.wikipedia.org/wiki/Bloom_filter"},
  {id:"db07",section:"Storage & Databases",tags:["storage"],front:"What are the SQL transaction isolation levels and what anomaly does each prevent?",back:"Read Uncommitted: no protection.\nRead Committed: prevents dirty reads.\nRepeatable Read: prevents non-repeatable reads (MySQL default).\nSerializable: prevents phantom reads — strongest, slowest.\n\nPhantom read: two identical range queries in same txn return different rows because another txn inserted in between.",source_url:"https://en.wikipedia.org/wiki/Isolation_(database_systems)"},
  {id:"db08",section:"Storage & Databases",tags:["storage"],front:"What is a time-series database, and what makes it different from a relational DB?",back:"A TSDB (e.g., InfluxDB, TimescaleDB) is optimized for append-heavy, time-ordered data with timestamp as primary dimension.\n\nDifferences: automatic partitioning by time, compression for sequential numeric data, downsampling (roll up old data), retention policies, no complex JOINs needed."},
  {id:"db09",section:"Storage & Databases",tags:["storage"],front:"What is a columnar storage format, and why is it better for analytics?",back:"Columnar (Parquet, ORC, Redshift): all values of one column together. Row stores: all columns of one row together.\n\nBetter for analytics: SELECT 2 of 100 columns reads 2% of data; better compression. Row stores better for OLTP (full row fetches)."},
  {id:"db10",section:"Storage & Databases",tags:["storage"],front:"What is a cache eviction policy, and what are the main options?",back:"LRU (Least Recently Used): evict oldest accessed — good for temporal locality.\nLFU (Least Frequently Used): evict least accessed — good for hotspot protection.\nFIFO: evict oldest inserted — simple, poor cache hit rate.\nRandom: simple, surprisingly competitive.\n\nRedis default: LRU (configurable). Most production systems use LRU or LFU.",source_url:"https://github.com/donnemartin/system-design-primer#when-to-update-the-cache"},
  {id:"db11",section:"Storage & Databases",tags:["storage"],front:"What is cache-aside (lazy loading) vs write-through caching?",back:"Cache-aside: app checks cache first; on miss, reads DB and populates cache. Simple but cache is stale until TTL.\n\nWrite-through: every write goes to cache AND DB synchronously. Cache always up to date, but writes are slower, wasted cache space for write-once keys.\n\nCache-aside is the default. Write-through for data you'll read immediately after writing.",source_url:"https://github.com/donnemartin/system-design-primer#when-to-update-the-cache"},
  {id:"db12",section:"Storage & Databases",tags:["storage"],front:"What is the N+1 query problem and how do you fix it?",back:"Fetch N parents, then N separate DB queries for children — O(N) queries instead of 2.\n\nFix: eager loading via JOIN, or batch all children in one IN() query then join in app code. ORMs: include/preload."},
  {id:"db13",section:"Storage & Databases",tags:["storage","scalability"],front:"What is a distributed transaction, and why is two-phase commit (2PC) problematic?",back:"A distributed transaction spans multiple nodes and must either all commit or all abort.\n\n2PC: Phase 1 (prepare): coordinator asks all participants if they're ready. Phase 2 (commit/abort): coordinator sends decision.\n\nProblem: if coordinator crashes after prepare but before commit, participants are stuck in uncertain state (blocking protocol). Slow and a SPOF.",source_url:"https://en.wikipedia.org/wiki/Two-phase_commit_protocol"},

  // SECTION 4 — MESSAGING & ASYNC
  {id:"mq01",section:"Messaging & Async",tags:["messaging","clay"],front:"What is the difference between a message queue (SQS) and a log-based message broker (Kafka)?",back:"Queue (SQS): message consumed once then deleted. Fan-out needs separate queues. Good for work distribution.\n\nLog (Kafka): messages retained; multiple consumer groups replay independently. Good for event streaming, audit trail, replay.",source_url:"https://github.com/donnemartin/system-design-primer#message-queues"},
  {id:"mq02",section:"Messaging & Async",tags:["messaging","clay"],front:"What is a dead-letter queue (DLQ) and why is it essential?",back:"Receives messages that fail processing repeatedly (exceed max retries).\n\nWithout DLQ: a poison-pill message loops forever, blocking the queue. DLQ quarantines bad messages for inspection without stopping the pipeline."},
  {id:"mq03",section:"Messaging & Async",tags:["messaging"],front:"What is backpressure, and how do message queues implement it?",back:"Consumers signal producers to slow down when they can't keep up.\n\nQueues: depth acts as buffer; if producers > consumers, queue grows until rejecting new messages. Kafka: consumer lag triggers alerts/scaling.",source_url:"https://github.com/donnemartin/system-design-primer#back-pressure"},
  {id:"mq04",section:"Messaging & Async",tags:["messaging"],front:"What is at-least-once vs exactly-once delivery, and what's required to achieve exactly-once?",back:"At-least-once: delivered ≥ 1 time. Requires idempotent consumers.\nAt-most-once: may drop, never duplicate.\nExactly-once: hardest.\n\nAchieving exactly-once: transactional producers + idempotent consumers + dedup (Kafka transactions, SQS FIFO dedup ID).",source_url:"https://github.com/donnemartin/system-design-primer#message-queues"},
  {id:"mq05",section:"Messaging & Async",tags:["messaging"],front:"What is pub/sub, and how does it differ from point-to-point messaging?",back:"Pub/sub: publisher emits to a topic; all subscribers receive it. Decoupled — publisher doesn't know subscribers.\n\nPoint-to-point: message goes to exactly one consumer (work queues).\n\nPub/sub fan-out: add subscribers without touching the publisher.",source_url:"https://github.com/donnemartin/system-design-primer#message-queues"},
  {id:"mq06",section:"Messaging & Async",tags:["messaging"],front:"What is Kafka's partition model, and how does it affect ordering and parallelism?",back:"Topic split into partitions. Strict order within a partition. Multiple consumers process different partitions in parallel.\n\nKey insight: ordering only within a partition. Partition key = user_id / entity_id ensures all events for one entity land in the same partition."},
  {id:"mq07",section:"Messaging & Async",tags:["messaging"],front:"When would you choose SQS over Kafka, and vice versa?",back:"SQS: simpler ops, fully managed, FIFO optional, good for task/work queues.\n\nKafka: high throughput (millions/sec), replay, multiple independent consumers, stream processing (Flink). Higher ops complexity."},
  {id:"mq08",section:"Messaging & Async",tags:["messaging"],front:"What is stream processing, and what are the three main window types?",back:"Computation on infinite, continuous streams (vs batch on finite datasets).\n\nWindows:\n1. Tumbling: fixed non-overlapping intervals (5m, 5m, 5m)\n2. Sliding: overlapping (every 1m over last 5m)\n3. Session: gaps in activity define boundaries"},
  {id:"mq09",section:"Messaging & Async",tags:["messaging","clay"],front:"What is the outbox pattern, and why does it solve dual-write problems?",back:"Write the business entity AND an outbox event row in the SAME transaction. A poller/CDC process reads the outbox and publishes to the queue.\n\nSolves dual-write: without this, DB write may succeed but event publish may fail (or vice versa). Atomic write guarantees both."},

  // SECTION 5 — RATE LIMITING
  {id:"rl01",section:"Rate Limiting",tags:["rate-limiting"],front:"What is the token bucket algorithm for rate limiting?",back:"A bucket holds up to N tokens and refills at rate R tokens/second.\nEach request consumes one token.\nIf bucket is empty: reject (or queue) the request.\n\nAllows bursting up to N requests instantaneously. Refill rate controls steady-state throughput. Most common algorithm for API rate limits.",source_url:"https://stripe.com/blog/rate-limiters"},
  {id:"rl02",section:"Rate Limiting",tags:["rate-limiting"],front:"What is the leaky bucket algorithm, and how does it differ from token bucket?",back:"Leaky bucket: requests enter a queue (the bucket); they're processed at a fixed rate (the leak). Requests that overflow are dropped.\n\nDifference: token bucket allows bursting (consume multiple tokens at once). Leaky bucket enforces constant output rate — smooths traffic. Token bucket is better for most APIs; leaky bucket for traffic shaping.",source_url:"https://en.wikipedia.org/wiki/Leaky_bucket"},
  {id:"rl03",section:"Rate Limiting",tags:["rate-limiting"],front:"What is the sliding window log algorithm for rate limiting?",back:"Store a timestamp for each request in a sorted set. To check rate limit: remove timestamps older than the window, count remaining entries, reject if > limit.\n\nMost accurate — no boundary artifacts. But memory cost is O(max_requests_per_window) per user. Redis sorted sets make this elegant.",source_url:"https://en.wikipedia.org/wiki/Token_bucket"},
  {id:"rl04",section:"Rate Limiting",tags:["rate-limiting"],front:"What is the fixed window counter rate limiting algorithm and its major flaw?",back:"Increment a counter per time window (e.g., per minute). Reset at window boundary. Simple, O(1) memory.\n\nFlaw: boundary burst — a user can send N requests at 11:59:59 and N more at 12:00:00, for 2N requests in 2 seconds. Sliding window solves this.",source_url:"https://stripe.com/blog/rate-limiters"},
  {id:"rl05",section:"Rate Limiting",tags:["rate-limiting","clay"],front:"Why must rate limiting be enforced in a shared service rather than per-worker?",back:"Partner API rate limits are global — LinkedIn doesn't care how many workers Clay runs. If 50 workers each track 100 req/min, they collectively exhaust 5000 req/min without realizing it.\n\nShared service (Redis-backed rate limiter) provides a single source of truth for all workers. Every worker checks the same counter before making a partner API call."},
  {id:"rl06",section:"Rate Limiting",tags:["rate-limiting","clay"],front:"What are the three tiers of rate limiting in a multi-tenant enrichment platform like Clay?",back:"1. Global per-partner: e.g., LinkedIn 5000 req/min total across all Clay\n2. Per-partner per-customer: prevent one customer from starving others\n3. Per-customer overall: billing/quota enforcement\n\nCheck ALL three tiers on each request; deny if any exceeded."},
  {id:"rl07",section:"Rate Limiting",tags:["rate-limiting"],front:"What is circuit breaking, and how does it relate to rate limiting?",back:"Circuit breaker pattern: if downstream fails repeatedly, open the circuit (reject requests immediately) instead of hammering a failing service.\n\nStates: closed (normal), open (reject fast), half-open (probe recovery).\n\nRelated to but different from rate limiting: rate limiting prevents overload; circuit breaking prevents cascading failure when a dependency is already down."},
  {id:"rl08",section:"Rate Limiting",tags:["rate-limiting","clay"],front:"What is the Redis command pattern for implementing token bucket rate limiting?",back:"Use a Lua script (atomic execution):\n1. GET current token count and last refill timestamp\n2. Calculate tokens added since last refill: min(max_tokens, tokens + rate * elapsed)\n3. If tokens ≥ 1: decrement and allow. Else: deny.\n4. SET new token count and timestamp\n\nMust be Lua (or MULTI/EXEC) to be atomic — no TOCTOU race.",source_url:"https://stripe.com/blog/rate-limiters"},

  // SECTION 6 — IDENTITY & DEDUP
  {id:"id01",section:"Identity & Dedup",tags:["identity-resolution","clay"],front:"What is entity resolution (record linkage), and why is it hard?",back:"Entity resolution identifies when records across systems refer to the same real-world entity (e.g., 'Apple Inc.' vs 'apple.com' vs 'Apple').\n\nHard because: names are ambiguous, data is messy, false positives and false negatives both have costs, scale is O(N²) if you compare everything naively."},
  {id:"id02",section:"Identity & Dedup",tags:["identity-resolution","clay"],front:"What is the blocking step in entity resolution, and why is it necessary?",back:"Blocking groups records into 'buckets' so you only compare records within the same bucket — reducing O(N²) comparisons to O(N·K) where K is average bucket size.\n\nCommon blocking keys: company domain, first 3 chars of name, LinkedIn ID. Any two records with NO blocking key in common are assumed non-matches."},
  {id:"id03",section:"Identity & Dedup",tags:["identity-resolution"],front:"What is fuzzy string matching, and name two algorithms used in record linkage?",back:"Fuzzy matching measures string similarity rather than exact equality.\n\n1. Levenshtein distance: min edits (insert, delete, replace) to transform one string to another. O(m*n).\n2. Jaro-Winkler: optimized for names, weights common prefix. Used in census record linkage.\n\nAlso: trigram similarity (pg_trgm in Postgres), soundex/metaphone for phonetic matching.",source_url:"https://en.wikipedia.org/wiki/Record_linkage"},
  {id:"id04",section:"Identity & Dedup",tags:["identity-resolution","clay"],front:"How would you use Postgres to implement fuzzy company name matching at scale?",back:"1. Install pg_trgm extension\n2. Create a GIN index on trigrams: CREATE INDEX idx_trgm ON companies USING gin(name gin_trgm_ops)\n3. Query: SELECT * FROM companies WHERE similarity(name, 'Stripe Inc') > 0.5 ORDER BY similarity DESC LIMIT 5\n\nGIN + trgm enables sub-second fuzzy search on millions of records."},
  {id:"id05",section:"Identity & Dedup",tags:["identity-resolution","clay"],front:"Where does identity resolution sit in a data enrichment pipeline, and why does placement matter?",back:"Identity resolution happens BEFORE the cache lookup.\n\nWhy: normalize all representations ('Stripe', 'stripe.com', 'Stripe Inc.') to a canonical_id first, then check cache by canonical_id. Without this, you get 3 cache entries for the same company — tripling API calls and wasting cache."},
  {id:"id06",section:"Identity & Dedup",tags:["identity-resolution"],front:"What is a Bloom filter, and how would you use it in a deduplication pipeline?",back:"Bloom filter: probabilistic set membership structure. 'Definitely not in set' or 'maybe in set.' False positives possible; false negatives impossible.\n\nDedup use: before expensive DB lookup, check Bloom filter if URL/ID was already processed. If 'definitely not': skip DB, process. If 'maybe': do precise DB lookup.\n\nMemory: ~10 bits per element at 1% false positive rate.",source_url:"https://en.wikipedia.org/wiki/Bloom_filter"},

  // SECTION 7 — CANONICAL PROBLEMS
  {id:"cp01",section:"Canonical Problems",tags:["scalability","storage"],front:"Design a URL shortener (like bit.ly). What are the key design decisions?",back:"1. ID generation: base62 counter (7 chars = 3.5T URLs) or hash + collision handling\n2. Storage: KV (short_code → url, expiry, click_count)\n3. Redirect: 301 (browser caches) vs 302 (every visit tracked) — use 302 for analytics\n4. Scale: Redis for hot URLs; CDN edge redirect\n5. Custom aliases: same table with unique constraint\n\nBottleneck: reads >> writes; cache aggressively.",source_url:"https://github.com/donnemartin/system-design-primer#design-pastebincom-or-bitly"},
  {id:"cp02",section:"Canonical Problems",tags:["scalability","storage"],front:"Design a web crawler. What are the main components and their challenges?",back:"Frontier (URL queue) → Fetcher → Parser → Storage → Dedup filter\n\nChallenges:\n- Politeness: per-domain rate limit\n- Dedup: Bloom filter + hash set of seen URLs\n- Cycles: canonical URL normalization\n- Scale: distributed BFS, partition by domain hash\n- Freshness: priority queue by PageRank / freshness",source_url:"https://github.com/donnemartin/system-design-primer#design-a-web-crawler"},
  {id:"cp03",section:"Canonical Problems",tags:["scalability","messaging"],front:"Design a news feed (like Twitter's home timeline). What are the two main fanout strategies?",back:"Fanout on write (push): when user posts, immediately write to all followers' feed caches. Fast reads, slow/expensive writes for celebrities.\n\nFanout on read (pull): feed is assembled at read time by merging posts from followees. Always fresh, but read is slow (N DB calls).\n\nHybrid (Twitter): fanout on write for normal users; fanout on read for celebrities. Merge at read time.",source_url:"https://github.com/donnemartin/system-design-primer#design-the-twitter-timeline-and-search-or-facebook-feed-and-search"},
  {id:"cp04",section:"Canonical Problems",tags:["rate-limiting","scalability"],front:"Design a rate limiter service. What's the API, storage, and key tradeoff?",back:"API: isAllowed(user_id, action) → bool\nStorage: Redis sorted set (sliding window) or Redis string with TTL (fixed window)\n\nKey tradeoff: accuracy vs memory\n- Fixed window: O(1) per user, boundary burst flaw\n- Sliding window log: O(requests) per user, accurate\n- Sliding window counter: O(1), approximate (interpolates)\n\nFor distributed: Redis is shared state; use Lua scripts for atomicity."},
  {id:"cp05",section:"Canonical Problems",tags:["scalability","messaging"],front:"Design a chat system (like Slack/WhatsApp). What delivery mechanism do you use for real-time messages?",back:"Delivery: WebSocket — persistent bidirectional connection, server pushes without polling.\n\nArchitecture: Chat service → Cassandra (wide rows, chat_id partition key) → fan out to recipient via presence service.\n\nOffline: store in inbox, deliver on reconnect.\nRead receipts: lightweight ack events."},
  {id:"cp06",section:"Canonical Problems",tags:["scalability","storage"],front:"Design a search autocomplete system. What data structures power the suggestions?",back:"Trie: O(L) lookup (L = prefix length). High memory for large vocabularies.\n\nBetter at scale: precompute top-K per prefix offline (Spark), store in Redis (prefix → JSON list).\n\nUpdating: batch nightly; optionally stream real-time queries to adjust weights."},
  {id:"cp07",section:"Canonical Problems",tags:["scalability","storage"],front:"Design a payment system. What are the critical properties and how do you ensure exactly-once?",back:"Critical: idempotency (never double-charge), atomicity, auditability.\n\n1. Client sends UUID idempotency key\n2. Server deduplicates by key → cached result\n3. Atomic debit+credit in one transaction\n4. Append-only ledger: sum of events = truth\n5. Two-phase: reserve → confirm. Rollback on failure."},
  {id:"cp08",section:"Canonical Problems",tags:["storage"],front:"Design a key-value store. What are the three main storage engine choices and their tradeoffs?",back:"1. In-memory only (Redis): fastest, loses data on crash. Add persistence via RDB snapshots or AOF log.\n2. Log-structured (Bitcask, RocksDB): all writes to append-only log + in-memory index. Great write perf, compaction overhead.\n3. B-tree (LevelDB predecessors): good read, more write overhead.\n\nFor distributed KV: consistent hashing for sharding + replication (Dynamo model).",source_url:"https://github.com/donnemartin/system-design-primer#design-a-key-value-store-for-a-search-engine"},
  {id:"cp09",section:"Canonical Problems",tags:["messaging","scalability"],front:"Design a notification system. What are the key components and failure modes?",back:"Event source → Notification Service → Delivery workers (push, email, SMS) → Delivery tracking\n\nFailure modes:\n- Lost: durable queue, ack after delivery only\n- Duplicate: idempotency key + dedup before send\n- Delivery failure: DLQ + exponential backoff retry\n- Preferences: filter before queueing"},
  {id:"cp10",section:"Canonical Problems",tags:["messaging","scalability"],front:"Design a distributed job queue. What are the guarantees and how do you handle worker failure?",back:"Guarantees: at-least-once delivery, one worker holds the job at a time.\n\nPattern: claim with visibility timeout — if worker crashes, job reappears after timeout for retry.\n\nImplementation: SQS visibility timeout, or DB table (job_id, status, locked_until, worker_id) with heartbeat to extend lock."},
  {id:"cp11",section:"Canonical Problems",tags:["storage","scalability"],front:"Design a ride-sharing location service. How do you efficiently store and query driver locations?",back:"Challenge: millions of location updates/sec; find nearest drivers in real-time.\n\nStorage options:\n- Geohash: encode lat/lng as string prefix; nearby cells share prefix\n- Redis GEOADD/GEORADIUS: built-in geo commands\n- S2 cells (Google): hierarchical cell decomposition\n\nCurrent location in Redis; historical in Postgres/Cassandra."},
  {id:"cp12",section:"Canonical Problems",tags:["interview-meta"],front:"What is the Alex Xu system design interview framework? Walk through the four steps.",back:"1. Understand (3-5 min): functional + non-functional requirements, constraints. Don't assume.\n2. High-level design (10-15 min): draw the happy path. API, storage, components. Get buy-in.\n3. Deep dive (10-15 min): pick 1-2 components. Go deep. Tradeoffs.\n4. Wrap up (3-5 min): bottlenecks, monitoring, improvements.\n\nAlways talk while drawing. Silence = lost points.",source_url:"https://github.com/donnemartin/system-design-primer#how-to-approach-a-system-design-interview-question"},

  // SECTION 8 — CLAY-SPECIFIC
  {id:"cl01",section:"Clay-Specific",tags:["clay"],front:"What is Clay's primary backend language and runtime?",back:"TypeScript + Python on Node.js runtime"},
  {id:"cl02",section:"Clay-Specific",tags:["clay"],front:"What is Clay's OLTP database?",back:"Postgres via AWS Aurora"},
  {id:"cl03",section:"Clay-Specific",tags:["clay"],front:"What cache layer does Clay use?",back:"Redis via AWS Elasticache"},
  {id:"cl04",section:"Clay-Specific",tags:["clay"],front:"What container platform does Clay run on?",back:"AWS ECS Fargate (NOT Kubernetes)"},
  {id:"cl05",section:"Clay-Specific",tags:["clay"],front:"What are Clay's observability tools?",back:"Datadog + CloudWatch + Mezmo"},
  {id:"cl06",section:"Clay-Specific",tags:["clay","scalability"],front:"What two scaling problems does Clay publicly call out in job postings?",back:"1. Node.js event loop blockages (CPU-bound work blocking async I/O)\n2. Sharding Postgres and Redis as data grows"},
  {id:"cl07",section:"Clay-Specific",tags:["clay"],front:"What is Clay's IaC tool?",back:"Terraform"},
  {id:"cl08",section:"Clay-Specific",tags:["clay"],front:"What is Clay's API style?",back:"REST/JSON (no GraphQL)"},
  {id:"cl09",section:"Clay-Specific",tags:["clay","clay-monday"],front:"What is the core Clay product, and what problem does it solve?",back:"Clay is a data enrichment and outbound automation platform. It pulls data about companies and people from 75+ sources (LinkedIn, Crunchbase, Apollo, etc.) and enriches records for sales teams.\n\nCore problem: sales teams waste time manually researching leads. Clay automates that enrichment pipeline."},
  {id:"cl10",section:"Clay-Specific",tags:["clay","clay-monday","identity-resolution","rate-limiting"],front:"Walk through what happens in Clay's architecture when a user uploads a CSV with 10,000 company names.",back:"1. CSV → API → Postgres (job_id, rows)\n2. Rows enqueued to SQS\n3. ECS Fargate workers pop rows\n4. Identity resolution: name → canonical_id (pg_trgm)\n5. Redis cache check by canonical_id\n6. Cache miss → per-source dispatcher → rate-limit check → partner API\n7. Response cached + written to results table\n8. Webhook/poll for completion"},
  {id:"cl11",section:"Clay-Specific",tags:["clay","clay-monday","scalability"],front:"Why is Node.js event loop blocking a specific risk for Clay, and how do you fix it?",back:"Node.js is single-threaded. CPU-intensive work (JSON parsing, fuzzy matching) blocks the event loop → latency spike for all concurrent requests.\n\nFixes:\n1. worker_threads for CPU work\n2. Separate Python/multiprocessing service for heavy computation\n3. Async I/O everywhere — never block the loop"},
  {id:"cl12",section:"Clay-Specific",tags:["clay","clay-monday"],front:"What vocabulary should you naturally drop in the Clay system design interview?",back:"Drop naturally: 'Postgres sharded by canonical_id hash, Elasticache Redis for rate-limit token buckets, ECS Fargate workers popping SQS, pg_trgm for fuzzy entity resolution, Datadog for observability'\n\nUsing their exact stack shows you did your homework."},

  // SECTION 9 — INTERVIEW META
  {id:"meta01",section:"Interview Meta",tags:["interview-meta"],front:"What are the five phases of a system design interview and their recommended time splits?",back:"1. Clarify requirements — 5 min (functional + non-functional)\n2. Capacity estimation — 5 min (back-of-envelope QPS, storage, bandwidth)\n3. High-level design — 15 min (draw boxes, define APIs, pick storage)\n4. Deep dive — 15 min (1-2 hot components, tradeoffs)\n5. Bottlenecks & wrap-up — 5 min (failure modes, monitoring, future improvements)",source_url:"https://github.com/donnemartin/system-design-primer#how-to-approach-a-system-design-interview-question"},
  {id:"meta02",section:"Interview Meta",tags:["interview-meta"],front:"What is the FIRST question you must ask in any system design interview?",back:"What are the functional AND non-functional requirements?\n\nFunctional: what does it do? (features, use cases)\nNon-functional: latency? consistency? scale (DAU, QPS)? availability SLA? geographic reach?\n\nNever design before knowing: scale + consistency model. These determine everything.",source_url:"https://github.com/donnemartin/system-design-primer#how-to-approach-a-system-design-interview-question"},
  {id:"meta03",section:"Interview Meta",tags:["interview-meta","clay-monday"],front:"What is Sahar's specific system design gap to watch for?",back:"'Ideas-to-whiteboard translation' — STOP clarifying endlessly and START drawing.\n\nExternalize the design visually. Get SOMETHING on the board, then refine. Silence while thinking = lost signal to interviewer. Narrate as you draw."},
  {id:"meta04",section:"Interview Meta",tags:["interview-meta"],front:"What does an interviewer probe when they ask 'how would this scale to 10x traffic?'",back:"They want:\n1. Identify the bottleneck (DB? cache? network?)\n2. Targeted solution (sharding, replica, CDN, async) — not 'bigger machines'\n3. Name the tradeoff the solution introduces\n4. Consider operational complexity\n\nNot a magic answer — structured reasoning under uncertainty."},
  {id:"meta05",section:"Interview Meta",tags:["interview-meta"],front:"What is a back-of-envelope calculation, and walk through an example for a URL shortener.",back:"Quick estimation to size the system before designing.\n\nURL shortener example (Alex Xu):\n- 100M URLs/day created → ~1,200 writes/sec\n- 10:1 read:write → 12,000 reads/sec\n- 5 years × 100M × 365 = 182.5B records\n- Each record ~500 bytes → ~91TB storage\n\nConclusions: reads are 10x writes → cache heavily. 100K QPS = needs sharding.",source_url:"https://github.com/donnemartin/system-design-primer#back-of-the-envelope-calculations"},
  {id:"meta06",section:"Interview Meta",tags:["interview-meta"],front:"What are the most common tradeoffs interviewers want to hear you articulate?",back:"1. Consistency vs availability (CAP)\n2. Latency vs durability (memory vs disk)\n3. Complexity vs scale (normalized vs denormalized)\n4. Cost vs performance (more replicas = $)\n5. Strong vs eventual consistency\n6. Pull vs push (fanout on read vs write)\n\n'I'd choose X because [reason], cost is [tradeoff]."},
  {id:"meta07",section:"Interview Meta",tags:["interview-meta"],front:"What does 'hot spot' mean in the context of a sharded database, and how do you fix it?",back:"One shard gets disproportionate traffic due to poor key choice (e.g., timestamp → all recent writes on one shard).\n\nFixes:\n1. Better shard key (user_id or entity hash)\n2. Add random suffix to key for celebrities/viral content\n3. Virtual nodes to remap hot shards across physical nodes"},
  {id:"meta08",section:"Interview Meta",tags:["interview-meta"],front:"How do you handle the 'celeb problem' (hot user) in a social graph system?",back:"Celebrity with 100M followers: fanout-on-write = 100M writes per post.\n\nStrategies:\n1. Hybrid: write to active followers; merge celebrity feed on read\n2. Cache celebrity's recent posts separately\n3. Pull only for celebrities: merge last N posts at read time\n\nTrade-off: more read complexity to avoid unbounded write amplification."},
  {id:"meta09",section:"Interview Meta",tags:["interview-meta"],front:"What are the key differences between an IC system design interview and an EM system design interview?",back:"IC focus: technical depth, algorithms, implementation tradeoffs, concrete numbers, failure modes.\n\nEM focus: all of the above PLUS: team structure, operational concerns, build vs buy, monitoring, onboarding, migration strategy, stakeholder tradeoffs.\n\nEM interviews reward: 'here's how I'd structure the team to own this' alongside the technical design."},
  {id:"meta10",section:"Interview Meta",tags:["interview-meta"],front:"When asked 'what monitoring would you add?', what's the right answer format?",back:"Three layers:\n1. Infra: CPU, memory, disk I/O, network latency\n2. App: error rate, p50/p95/p99 latency, throughput, queue depth\n3. Business: enrichments/min, cache hit rate, partner API budget\n\nAlert on: error rate spikes, p99 crossing SLA, queue depth growing unboundedly, partner rate limit approaching 80%."},
  {id:"meta11",section:"Interview Meta",tags:["interview-meta"],front:"How do you talk about a system you've actually built versus one you're designing from scratch in an interview?",back:"Lead with 'here's what we actually did and why.' Specifics beat theory.\n\nFormat: 'At [company] we had [problem]. Tried [X], hit [issue]. Did [Y], which solved it but introduced [tradeoff]. If doing again: [improvement].'\n\nReal experience > hypothetical design. Use your Clay prep knowledge this way."},

  // SECTION 10 — DDIA CONCEPTS
  {id:"ddia01",section:"DDIA Concepts",tags:["storage","scalability"],front:"What is the difference between a single-leader and a multi-leader replication topology? When is each appropriate?",back:"Single-leader: all writes to one primary, replicated to followers. Simple, consistent. Good for most web apps.\n\nMulti-leader: writes at any node or per-DC leader. Local writes per region. Complex conflict resolution needed.\n\nUse for: geo-distributed apps where cross-DC write latency is unacceptable (collaborative editing, calendar sync).",source_url:"https://github.com/donnemartin/system-design-primer#replication"},
  {id:"ddia02",section:"DDIA Concepts",tags:["storage","scalability"],front:"What is leaderless replication (Dynamo model), and how do quorums work?",back:"Any replica accepts writes. Quorum: W + R > N ensures overlap. N=3, W=2, R=2 → every read includes at least one fresh node.\n\nTrade-off: no SPOF, tunable consistency. Concurrent writes may conflict → need resolution (last-write-wins, vector clocks).",source_url:"https://github.com/donnemartin/system-design-primer#replication"},
  {id:"ddia03",section:"DDIA Concepts",tags:["scalability"],front:"What is a vector clock, and what problem does it solve in distributed systems?",back:"Per-node counter array capturing causal ordering. Each node increments its own counter; merges on communication.\n\nIf V1 < V2: V2 happened after V1. If neither ≤ the other: concurrent conflict → needs resolution.\n\nUsed in: DynamoDB, Riak.",source_url:"https://en.wikipedia.org/wiki/Vector_clock"},
  {id:"ddia04",section:"DDIA Concepts",tags:["storage","messaging"],front:"What is an event sourcing pattern, and how does it differ from traditional CRUD?",back:"State = replay of append-only event log. Traditional CRUD stores current state only; history is lost.\n\nBenefits: full audit log, replay to any point, derive new projections from same events.\n\nCosts: slow replay (snapshots help), eventual consistency for read models, more complex reads."},
  {id:"ddia05",section:"DDIA Concepts",tags:["storage"],front:"What is CQRS, and why is it often paired with event sourcing?",back:"CQRS: separate write model (commands) from read model (queries).\n\nWith event sourcing: events update the write log; read projections built asynchronously, each optimized for its query pattern.\n\nTrade-off: eventual consistency between write/read models; higher complexity; better read performance at scale."},
  {id:"ddia06",section:"DDIA Concepts",tags:["storage"],front:"What is the difference between optimistic and pessimistic concurrency control?",back:"Optimistic: assume conflicts are rare. Write with CAS check (WHERE version = old_version); retry on failure. Good for low-contention.\n\nPessimistic: lock before reading. Good for high-contention or multi-step transactions. Cost: lock contention, deadlocks."},
  {id:"ddia07",section:"DDIA Concepts",tags:["storage"],front:"What is linearizability, and why is it different from serializability?",back:"Linearizability: operations appear atomic at a single point in time — single consistent timeline.\n\nSerializability: concurrent transactions produce the same result as some serial order. About transactions, not individual ops.\n\nStrict serializability = both. Most systems offer one or the other."},
  {id:"ddia08",section:"DDIA Concepts",tags:["storage","messaging"],front:"What is change data capture (CDC) and what is it used for?",back:"Reads the DB replication log (Postgres WAL) and publishes row changes as an event stream.\n\nUse cases: sync to Elasticsearch, populate caches, feed event-sourcing systems, real-time analytics.\n\nTools: Debezium, AWS DMS, Kafka Connect.",source_url:"https://en.wikipedia.org/wiki/Change_data_capture"},
  {id:"ddia09",section:"DDIA Concepts",tags:["storage"],front:"What is the difference between a data lake, data warehouse, and data lakehouse?",back:"Data lake: raw/semi-structured data (S3, HDFS). Schema-on-read. Cheap, flexible, hard to query directly.\n\nData warehouse: structured, transformed (Redshift, BigQuery, Snowflake). Schema-on-write. Optimized for analytical SQL.\n\nData lakehouse: raw data in open formats (Parquet/Delta Lake) + warehouse-style query engines (Databricks, Iceberg). Best of both worlds."},
  {id:"ddia10",section:"DDIA Concepts",tags:["storage"],front:"What is MapReduce, and when is it still relevant vs Spark/Flink?",back:"MapReduce: Map (filter/transform → key-value pairs) → shuffle → Reduce (aggregate by key). Batch, fault-tolerant.\n\nStill relevant: cold data, Hadoop ecosystems, simple transforms.\n\nSpark/Flink supersede it: in-memory (10-100x faster), streaming, iterative ML, richer APIs.\n\nIn interviews: describe the concept; note production uses Spark/Flink now."},

  // SECTION 11 — NETWORKING
  {id:"net01",section:"Networking & Protocols",tags:["scalability"],front:"What is the difference between TCP and UDP, and when do you use each?",back:"TCP: reliable, ordered, ACKs + retransmit. Use for: HTTP, databases, file transfer.\n\nUDP: unreliable, connectionless, no ordering. Lower latency. Use for: video, gaming, DNS, VoIP — a dropped packet beats waiting.",source_url:"https://github.com/donnemartin/system-design-primer#transmission-control-protocol-tcp"},
  {id:"net02",section:"Networking & Protocols",tags:["scalability"],front:"What is DNS and how does DNS caching affect system design?",back:"Maps domain → IP via root → TLD → authoritative nameserver.\n\nTTL: low = fast failover, more lookups. High = faster resolution, slow propagation.\n\nDesign: DNS round-robin is a simple LB. Route 53 geo-routing enables region failover.",source_url:"https://github.com/donnemartin/system-design-primer#domain-name-system"},
  {id:"net03",section:"Networking & Protocols",tags:["scalability"],front:"What is HTTP/2 vs HTTP/1.1, and what problems does HTTP/2 solve?",back:"HTTP/1.1: one request per TCP connection; HOL blocking with pipelining. Browsers open 6 connections per domain.\n\nHTTP/2: multiplexing (multiple streams, one TCP, no HOL blocking), HPACK header compression, server push.\n\nResult: fewer round-trips, lower latency for many small resources."},
  {id:"net04",section:"Networking & Protocols",tags:["scalability"],front:"What is a WebSocket and when should you use it over HTTP polling?",back:"WebSocket: persistent bidirectional TCP connection. Either side sends anytime. Low overhead after handshake.\n\nUse for: chat, live dashboards, collaborative editing, gaming.\n\nAlternatives: short polling (frequent requests) or long polling (hang until event) — both waste more resources.",source_url:"https://github.com/donnemartin/system-design-primer#hypertext-transfer-protocol-http"},
  {id:"net05",section:"Networking & Protocols",tags:["scalability"],front:"What is gRPC, and when does it outperform REST?",back:"gRPC: Protocol Buffers (binary) over HTTP/2.\n\nBeats REST for: high throughput, many small messages, service-to-service, streaming.\n\nProto: strongly typed schema → generated clients, no JSON overhead.\n\nWeaknesses: binary is harder to debug, not browser-native (needs gRPC-web proxy), schema coupling.",source_url:"https://github.com/donnemartin/system-design-primer#remote-procedure-call-rpc"},

  // SECTION 12 — AVAILABILITY & RELIABILITY
  {id:"rel01",section:"Availability & Reliability",tags:["scalability"],front:"What does '4 nines' mean, and how much downtime does it allow per year?",back:"99.99% availability = 4 nines.\nDowntime allowed: 0.01% × 365 × 24 × 60 = ~52 minutes/year.\n\n3 nines (99.9%): ~8.7 hours/year\n4 nines (99.99%): ~52 minutes/year\n5 nines (99.999%): ~5 minutes/year\n\nEach additional nine is ~10x harder. 5 nines requires zero-downtime deploys, redundant everything, automated failover.",source_url:"https://github.com/donnemartin/system-design-primer#availability-in-numbers"},
  {id:"rel02",section:"Availability & Reliability",tags:["scalability"],front:"What is a health check, and what's the difference between liveness and readiness probes?",back:"Liveness probe: 'is the process alive?' Fails → restart container. Catches deadlocks/infinite loops.\n\nReadiness probe: 'ready to serve traffic?' Fails → remove from LB pool. Catches: startup incomplete, dependency down, overloaded.\n\nDon't return liveness=healthy during warmup — use readiness instead."},
  {id:"rel03",section:"Availability & Reliability",tags:["scalability"],front:"What is a single point of failure (SPOF) and how do you eliminate it?",back:"SPOF: one component whose failure takes down the whole system.\n\nElimination:\n- Active-passive failover: standby node promoted on failure\n- Active-active: multiple nodes share load; any can fail\n- Replication: DB replicas, storage RAID\n- Geographic distribution: multi-AZ, multi-region\n- Timeouts + circuit breakers: degrade gracefully when dependency fails",source_url:"https://github.com/donnemartin/system-design-primer#availability-patterns"},
  {id:"rel04",section:"Availability & Reliability",tags:["scalability"],front:"What is chaos engineering, and what famous tool implements it?",back:"Deliberately inject failures (kill servers, add latency, partition networks) to test resilience before real incidents.\n\nNetflix Chaos Monkey: randomly terminates EC2 instances in production.\n\nPrinciple: failure paths you don't exercise will fail at the worst possible time."},
  {id:"rel05",section:"Availability & Reliability",tags:["scalability"],front:"What is exponential backoff with jitter, and why is jitter important?",back:"Backoff: wait 1s → 2s → 4s → 8s before retry. Prevents hammering a recovering service.\n\nJitter: add random variance. Without it, all simultaneous failures retry simultaneously (thundering herd).\n\nFormula: wait = min(cap, base * 2^attempt) + random(0, base)"},

  // NEW — STARS/BEHAVIORAL (for EM screen)
  {id:"star01",section:"Behavioral (STAR)",tags:["stars","clay-monday"],front:"STAR prompt: Tell me about a time you shipped something important under significant pressure or a tight deadline.",back:"Structure:\n- Situation: context (team size, stakes, deadline)\n- Task: your specific role / responsibility\n- Action: what YOU did — decisions made, tradeoffs, how you rallied others\n- Result: outcome (quantified if possible), what you learned\n\nTip: Lead with the tension. 'We had 3 days and the CEO had promised the customer.' Interviewers remember stakes."},
  {id:"star02",section:"Behavioral (STAR)",tags:["stars","clay-monday"],front:"STAR prompt: Describe a conflict with a colleague or stakeholder and how you resolved it.",back:"Structure:\n- Situation: the conflict and why it existed (different priorities, data, or values)\n- Task: what was at stake\n- Action: how you approached it — curiosity first, stated view clearly, found common ground\n- Result: what changed, what you'd do differently\n\nTip: Don't sanitize — interviewers want to see you hold tension without caving or steamrolling."},
  {id:"star03",section:"Behavioral (STAR)",tags:["stars","clay-monday"],front:"STAR prompt: Tell me about a time you had to disagree with a senior person or push back on a decision.",back:"Structure:\n- Situation: what was being decided, who the senior person was\n- Task: why you had a different view and what was at stake\n- Action: how you raised it — specific framing, data you used, timing\n- Result: did they change course? Did you? What was the outcome?\n\nTip: The ideal story shows you disagreed respectfully AND committed fully once the decision was made."},
  {id:"star04",section:"Behavioral (STAR)",tags:["stars","clay-monday"],front:"STAR prompt: Tell me about a time you mentored or grew someone on your team.",back:"Structure:\n- Situation: who (level, context), what gap you saw\n- Task: what you were helping them achieve\n- Action: specific things — feedback style, 1:1 structure, stretch assignments\n- Result: how they grew (promotion, shipped independently, led a project)\n\nTip: Friction makes growth stories credible. 'Bloomed immediately' is less believable."},
  {id:"star05",section:"Behavioral (STAR)",tags:["stars","clay-monday"],front:"STAR prompt: Describe the most painful or difficult project you've worked on.",back:"Structure:\n- Situation: why it was painful (scope creep? unclear ownership? technical debt? people issues?)\n- Task: what your responsibility was\n- Action: how you navigated it — decisions you made, what you gave up, what you protected\n- Result: how it ended, what you'd do differently\n\nTip: Vulnerability + agency is the winning combination. Show that you felt the pain AND took concrete action despite it."},
  {id:"star06",section:"Behavioral (STAR)",tags:["stars","clay-monday"],front:"STAR prompt: Tell me why you want to work at Clay and why this role specifically.",back:"Frame as conviction, not generic enthusiasm.\n\n- Clay's problem: enrichment + outbound automation at scale\n- Why now: early-stage problems in a late-stage-growth company\n- Why you: systems background, data pipelines\n- What you'd bring: specific areas with immediate impact\n\nAvoid: 'I love Clay's mission.'\nUse: 'I want to work on the enrichment pipeline scaling problem.'"},

  // NEW — EM/WHY QUESTIONS
  {id:"em01",section:"EM Prep",tags:["clay-monday","interview-meta"],front:"What are 3-5 strong questions to ask an EM interviewer at Clay?",back:"1. What does on-call look like? P95 incident cadence?\n2. Features vs. infra debt — how do you navigate it?\n3. First 90 days: ramp project or own something immediately?\n4. Most technical risk on this team?\n5. Build vs. buy philosophy for infra?\n\nPick 2-3. Questions about risk > questions about perks."},
  {id:"em02",section:"EM Prep",tags:["clay-monday","interview-meta"],front:"How should you frame your engineering management style in an EM interview?",back:"Be concrete, not 'I'm collaborative and data-driven.'\n\n- 1:1s: blockers, not status\n- Feedback in the moment\n- Heavy context upfront, then get out of the way\n- Underperformance: explicit early, 30-day recovery arc\n\nAnchor with a specific story."},

  // NEW — NOTION PREP
  {id:"notion01",section:"Notion Prep",tags:["notion-prep"],front:"What is the openai Python SDK v0.27.x API for chat completions?",back:"import openai\nopenai.api_key = 'sk-...'\n\nresponse = openai.ChatCompletion.create(\n  model='gpt-4',\n  messages=[\n    {'role': 'system', 'content': 'You are a helpful assistant.'},\n    {'role': 'user', 'content': 'Hello'}\n  ]\n)\ntext = response['choices'][0]['message']['content']\n\nKey: openai==0.27.8 uses dict access, not attribute access. response['choices'] not response.choices."},
  {id:"notion02",section:"Notion Prep",tags:["notion-prep"],front:"How do you implement JSON search / filtering in Python without a DB?",back:"Pattern 1 — equality: [r for r in records if r.get('field') == value]\n\nPattern 2 — nested safe access: record.get('nested', {}).get('field', default)\n\nPattern 3 — substring: [r for r in records if search_term.lower() in r.get('name','').lower()]\n\nPattern 4 — multi-field: [r for r in records if r.get('type')=='A' and r.get('score',0)>threshold]"},
  {id:"notion03",section:"Notion Prep",tags:["notion-prep"],front:"How do you structure a function-calling / tool-use pattern with openai==0.27.8?",back:"response = openai.ChatCompletion.create(\n  model='gpt-4-0613',\n  messages=messages,\n  functions=[{'name':'search_records','description':'Search by criteria','parameters':{'type':'object','properties':{'query':{'type':'string'}},'required':['query']}}],\n  function_call='auto'\n)\n\nmsg = response['choices'][0]['message']\nif msg.get('function_call'):\n  args = json.loads(msg['function_call']['arguments'])"},
  {id:"notion04",section:"Notion Prep",tags:["notion-prep"],front:"What are the screen-share meta rules for a Python coding screen?",back:"1. Think aloud — narrate before you type\n2. Start with brute-force, then optimize\n3. Name variables descriptively (screenshare is read live)\n4. Test with a simple example before running\n5. If stuck: restate the problem, talk through the constraint\n6. openai==0.27.8: always use dict access for responses\n7. Ask about edge cases before coding them"},

  // NEW — FLORAL PREP
  {id:"floral01",section:"Floral Prep",tags:["floral-prep"],front:"Python json.load vs json.loads — what's the difference?",back:"json.load(f): reads from a FILE OBJECT\n  with open('data.json') as f:\n    data = json.load(f)\n\njson.loads(s): reads from a STRING\n  data = json.loads('{\"key\": \"value\"}')\n\nCommon trap: passing a filename string to json.load() raises TypeError. json.load needs a file handle, not a path."},
  {id:"floral02",section:"Floral Prep",tags:["floral-prep"],front:"Python file modes: what are 'r', 'w', 'a', 'rb', 'r+' and when do you use each?",back:"'r': read text (default). Error if file doesn't exist.\n'w': write text. Creates or TRUNCATES file.\n'a': append text. Creates if missing, never truncates.\n'rb': read binary. For images, pickles, etc.\n'r+': read AND write. Doesn't truncate. Error if missing.\n\nCommon trap: using 'w' when you mean 'a' — silently destroys existing content."},
  {id:"floral03",section:"Floral Prep",tags:["floral-prep"],front:"Python Counter: what is it and how do you use it for log analysis?",back:"from collections import Counter\n\n# Count occurrences\nwords = ['a','b','a','c','a','b']\nc = Counter(words)  # Counter({'a': 3, 'b': 2, 'c': 1})\nc.most_common(2)    # [('a', 3), ('b', 2)]\nc['a']              # 3\nc['missing']        # 0 (no KeyError)\n\nLog pattern: Counter(line.split()[0] for line in open('app.log'))  # count by first field"},
  {id:"floral04",section:"Floral Prep",tags:["floral-prep"],front:"Python sorted() with key — how do you sort a list of dicts by a field?",back:"# ascending\nsorted(records, key=lambda r: r['score'])\n\n# descending\nsorted(records, key=lambda r: r['score'], reverse=True)\n\n# multiple fields\nsorted(records, key=lambda r: (r['type'], -r['score']))\n\n# missing key safe\nsorted(records, key=lambda r: r.get('score', 0))"},
  {id:"floral05",section:"Floral Prep",tags:["floral-prep"],front:"Log parsing pattern: how do you identify session boundaries in a stream of timestamped log lines?",back:"Detect gaps > threshold between consecutive events from same user.\n\nlogs.sort(key=lambda x: (x['user_id'], x['timestamp']))\nsessions = []\ncurrent = []\nfor log in logs:\n  if current and (log['timestamp'] - current[-1]['timestamp'] > SESSION_GAP or log['user_id'] != current[-1]['user_id']):\n    sessions.append(current)\n    current = []\n  current.append(log)\nif current: sessions.append(current)\n\nKEY: sort by user then time. Session boundary = gap OR user change."},
  {id:"floral06",section:"Floral Prep",tags:["floral-prep"],front:"What is a systems-data pattern question, and how do you approach it in a HackerRank context?",back:"Given a log file / JSON records, compute metrics or find anomalies.\n\nApproach:\n1. Read all data first (don't stream unless required)\n2. Build intermediate structure (dict of lists, Counter, etc.)\n3. Compute answer from structure\n4. Print in required format\n\nMistake: one-pass streaming before understanding the problem. Read-then-compute wins for clarity."},

  // DRAW-FIRST CARDS
  {id:"draw01",section:"Draw-First",tags:["clay","clay-monday"],type:"draw-first",front:"Design the Clay enrichment pipeline. Draw it: from CSV upload to enriched results.",back:"The canonical flow:\n\nCSV Upload → API → Postgres (job + rows) → SQS Queue → ECS Fargate Workers → Identity Resolution (pg_trgm) → Redis Cache Check → Per-Source Rate Limiter (Redis token bucket) → Partner API → Cache Write → Results Table → Webhook/Poll\n\nKey boxes: Ingestion, Queue, Worker Pool, ID Resolver, Cache, Rate Limiter, Partner APIs, Output Store",diagram:"clay-pipeline"},
  {id:"draw02",section:"Draw-First",tags:["scalability"],type:"draw-first",front:"Design a web crawler at scale. Draw the components and data flow.",back:"Frontier Queue (URL priority queue) → Fetcher Workers → Dedup Filter (Bloom filter + Redis) → Parser → Content Store (S3) → URL Extractor → Frontier Queue (loop)\n\nSidecar: Politeness Manager (per-domain rate limit), Robots.txt Cache, Canonicalizer",diagram:"web-crawler",source_url:"https://github.com/donnemartin/system-design-primer#design-a-web-crawler"},
  {id:"draw03",section:"Draw-First",tags:["scalability"],type:"draw-first",front:"Design a URL shortener. Draw the read path and write path separately.",back:"WRITE PATH: Client → API Server → ID Generator (Redis INCR or Snowflake) → Postgres (store mapping) → Redis Cache (warm) → return short URL\n\nREAD PATH: Client → CDN (cache 302) → Load Balancer → API Server → Redis Cache (check) → Postgres fallback → 302 Redirect\n\nKey insight: reads are 100x writes. CDN + Redis absorb >99% of read traffic.",diagram:"url-shortener",source_url:"https://github.com/donnemartin/system-design-primer#design-pastebincom-or-bitly"},
  {id:"draw04",section:"Draw-First",tags:["scalability"],type:"draw-first",front:"Design a distributed rate limiter. Draw the architecture.",back:"Client → API Gateway → Rate Limiter Service → Redis Cluster (token buckets, Lua scripts)\n\nRedis key: rl:{user_id}:{action}:{window}\nLua script: atomic token-bucket check-and-decrement\nFallback: if Redis down → fail-open (allow) or fail-closed (deny) — document the choice\n\nMulti-tier: check global limit → customer limit → per-resource limit. Deny if any exceeded.",diagram:"rate-limiter",source_url:"https://stripe.com/blog/rate-limiters"},
  {id:"draw05",section:"Draw-First",tags:["identity-resolution","clay"],type:"draw-first",front:"Design the identity resolution component of an enrichment pipeline. Draw the decision tree.",back:"Input: raw company name or domain\n\n1. Normalize: lowercase, strip Inc/LLC/Ltd, extract domain\n2. Exact domain match → canonical_id\n3. Redis cache by normalized name → canonical_id\n4. pg_trgm fuzzy match (similarity > 0.7) → canonical_id\n5. No match → CREATE entity, assign canonical_id, cache it\n\nBlocking keys: domain, first-3-chars-of-name, LinkedIn ID",diagram:"identity-resolver"},
  {id:"draw06",section:"Draw-First",tags:["scalability"],type:"draw-first",front:"Design a chat system (Slack-style). Draw the message delivery path.",back:"Sender → WebSocket Connection → Chat Service → Message Store (Cassandra, partition by channel_id) → Presence Service → Push to Recipient WebSocket(s)\n\nOffline path: Recipient WebSocket server → check presence → not connected → write to Inbox table → deliver on reconnect\n\nFan-out: for group channels, fan out to N connected users. Use pub/sub (Redis channel) per chat room.",diagram:"chat-system",source_url:"https://github.com/donnemartin/system-design-primer#communication"},
];
