"identity-resolver": `<pre style="font-size:12px;line-height:1.7;overflow-x:auto;background:var(--bg);padding:12px;border-radius:8px;border:1px solid var(--border)">Input: raw company name or domain

1. Normalize: lowercase, strip Inc/LLC/Ltd, extract domain
         ↓
2. Exact domain match in Postgres → canonical_id  ✓ return
         ↓ (no match)
3. Redis cache lookup by normalized name → canonical_id  ✓ return
         ↓ (miss)
4. pg_trgm fuzzy match (similarity > 0.7) → canonical_id  ✓ return
         ↓ (no match)
5. CREATE new entity → assign new canonical_id → cache in Redis

Blocking keys: domain, first-3-chars-of-name, LinkedIn ID</pre>`,
"chat-system": `<pre style="font-size:12px;line-height:1.7;overflow-x:auto;background:var(--bg);padding:12px;border-radius:8px;border:1px solid var(--border)">Sender (WebSocket)
    ↓
Chat Service
    ↓                        ↓
Cassandra store          Presence Service
(partition: channel_id)       ↓
                         Is recipient online?
                           ↓          ↓
                         YES          NO
                           ↓          ↓
                      WS Push     Inbox table
                                  (deliver on reconnect)

Group channels: Redis pub/sub per room → fan-out to N WebSockets
Read receipts: lightweight ack events sent back to server</pre>`
};

// SM-2 state management
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function getCardState(progress, id) {
  return progress[id] || { ease: 2.5, interval: 1, due: 0, reps: 0 };
}
function isDue(state) { return state.due <= Date.now(); }
function applyRating(state, rating) {
  let { ease, interval, reps } = state;
  if (rating === 'again') { interval = 1; ease = Math.max(1.3, ease - 0.2); reps = 0; }
  else if (rating === 'hard') { interval = Math.max(1, Math.ceil(interval * 1.2)); ease = Math.max(1.3, ease - 0.15); }
  else if (rating === 'good') { interval = reps === 0 ? 1 : Math.min(180, Math.ceil(interval * ease)); reps += 1; }
  else { interval = reps === 0 ? 4 : Math.min(180, Math.ceil(interval * ease * 1.3)); ease = Math.min(3.0, ease + 0.15); reps += 1; }
  return { ease, interval, due: Date.now() + interval * 86400000, reps };
}

// App state
let currentSession = [];
let sessionIndex = 0;
let sessionDone = 0;
let sessionMode = 'review'; // 'review' | 'drill' | 'sim'
let sessionSimId = null;
let sessionRatings = {};
let selectedSections = new Set();
let filterAll = true;
let drawRevealed = false;

function getCardById(id) { return CARDS.find(c => c.id === id); }

// Build flattened sim card list with phase info
function buildSimSession(simId) {
  const sim = SIMULATORS.find(s => s.id === simId);
  if (!sim) return [];
  const result = [];
  sim.phases.forEach(phase => {
    phase.cardIds.forEach(cid => {
      const card = getCardById(cid);
      if (card) result.push({...card, simPhase: phase.label});
    });
  });
  return result;
}

function init() {
  const sections = [...new Set(CARDS.map(c => c.section))];
  const filtersEl = document.getElementById('sectionFilters');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active'; allBtn.textContent = 'All sections'; allBtn.dataset.section = '__all__';
  allBtn.onclick = () => toggleFilter('__all__');
  filtersEl.appendChild(allBtn);
  sections.forEach(s => {
    const btn = document.createElement('button'); btn.className = 'filter-btn'; btn.textContent = s; btn.dataset.section = s;
    btn.onclick = () => toggleFilter(s); filtersEl.appendChild(btn);
  });
  buildTagGrid();
  buildSimList();
  renderDeckList();
  updateHeaderStats();
}

function buildTagGrid() {
  const grid = document.getElementById('tagGrid');
  TAGS.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (tag.featured ? ' featured' : '');
    const count = CARDS.filter(c => c.tags && c.tags.includes(tag.id)).length;
    btn.innerHTML = `${tag.label} <span style="opacity:.6;font-size:12px">(${count})</span>`;
    btn.title = tag.desc || '';
    btn.onclick = () => startDrill(tag.id);
    grid.appendChild(btn);
  });
}

function buildSimList() {
  const list = document.getElementById('simList');
  SIMULATORS.forEach(sim => {
    const el = document.createElement('div'); el.className = 'sim-option';
    const cardCount = buildSimSession(sim.id).length;
    el.innerHTML = `<h3>${sim.title}</h3><div class="meta">${sim.date} &mdash; ${sim.desc} &mdash; ${cardCount} cards</div>`;
    el.onclick = () => startSim(sim.id);
    list.appendChild(el);
  });
}

function toggleFilter(section) {
  if (section === '__all__') { filterAll = true; selectedSections.clear(); }
  else {
    filterAll = false;
    if (selectedSections.has(section)) { selectedSections.delete(section); if (selectedSections.size === 0) filterAll = true; }
    else selectedSections.add(section);
  }
  document.querySelectorAll('.filter-btn').forEach(btn => {
    if (filterAll) btn.classList.toggle('active', btn.dataset.section === '__all__');
    else btn.classList.toggle('active', selectedSections.has(btn.dataset.section));
  });
  renderDeckList();
}

function renderDeckList() {
  const progress = loadProgress();
  const sections = [...new Set(CARDS.map(c => c.section))];
  const listEl = document.getElementById('deckList'); listEl.innerHTML = '';
  let totalDue = 0;
  sections.forEach(s => {
    if (!filterAll && !selectedSections.has(s)) return;
    const cards = CARDS.filter(c => c.section === s);
    const due = cards.filter(c => isDue(getCardState(progress, c.id))).length;
    totalDue += due;
    const div = document.createElement('div'); div.className = 'section-card';
    div.innerHTML = `<h3>${s}</h3><div class="meta">${cards.length} cards${due > 0 ? ` &mdash; <span style="color:var(--accent)">${due} due</span>` : ' &mdash; all reviewed'}</div>`;
    div.onclick = () => { filterAll = false; selectedSections = new Set([s]); document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.section === s)); renderDeckList(); };
    listEl.appendChild(div);
  });
  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = totalDue === 0;
  startBtn.textContent = totalDue > 0 ? `Start Review (${totalDue} due)` : 'All cards reviewed!';
}

function updateHeaderStats() {
  const progress = loadProgress();
  const total = CARDS.length;
  const due = CARDS.filter(c => isDue(getCardState(progress, c.id))).length;
  document.getElementById('headerStats').textContent = `${total} cards · ${due} due`;
}

// --- Screen transitions ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showLanding() { showScreen('landing'); renderDeckList(); updateHeaderStats(); }
function showSimPicker() { showScreen('simPicker'); }

// --- Drill modal ---
function openDrillModal() { document.getElementById('drillModal').classList.add('active'); }
function closeDrillModal() { document.getElementById('drillModal').classList.remove('active'); }

// --- Session starters ---
function startSession() {
  const progress = loadProgress();
  const activeSections = filterAll ? null : selectedSections;
  currentSession = CARDS.filter(c => {
    if (activeSections && !activeSections.has(c.section)) return false;
    return isDue(getCardState(progress, c.id));
  }).sort(() => Math.random() - 0.5);
  if (!currentSession.length) return;
  sessionMode = 'review'; sessionSimId = null; sessionRatings = {};
  sessionIndex = 0; sessionDone = 0;
  setupStudyMode('review');
  showScreen('study'); showCard();
}

function startDrill(tagId) {
  closeDrillModal();
  currentSession = CARDS.filter(c => c.tags && c.tags.includes(tagId)).sort(() => Math.random() - 0.5);
  if (!currentSession.length) { alert('No cards for that tag yet.'); return; }
  sessionMode = 'drill'; sessionSimId = tagId; sessionRatings = {};
  sessionIndex = 0; sessionDone = 0;
  setupStudyMode('drill');
  showScreen('study'); showCard();
}

function startSim(simId) {
  currentSession = buildSimSession(simId);
  if (!currentSession.length) return;
  sessionMode = 'sim'; sessionSimId = simId; sessionRatings = {};
  sessionIndex = 0; sessionDone = 0;
  setupStudyMode('sim');
  showScreen('study'); showCard();
}

function setupStudyMode(mode) {
  const badge = document.getElementById('modeBadge');
  if (mode === 'drill') { badge.style.display = 'inline-block'; badge.className = 'mode-badge drill'; badge.textContent = 'Drill Mode'; }
  else if (mode === 'sim') { badge.style.display = 'inline-block'; badge.className = 'mode-badge sim'; badge.textContent = 'Simulator'; }
  else { badge.style.display = 'none'; }
}

// --- Card display ---
function showCard() {
  if (sessionIndex >= currentSession.length) { showDone(); return; }
  const card = currentSession[sessionIndex];
  drawRevealed = false;
  document.getElementById('cardSection').textContent = card.section;
  document.getElementById('cardFront').textContent = card.front;
  const backEl = document.getElementById('cardBack'); backEl.textContent = card.back; backEl.classList.remove('visible');
  document.getElementById('showBtn').style.display = 'block';
  document.getElementById('ratingRow').classList.remove('visible');
  document.getElementById('phaseLabel').textContent = card.simPhase || '';
  document.getElementById('drawDiagram').style.display = 'none'; document.getElementById('drawDiagram').innerHTML = '';
  const lm = document.getElementById('learnMoreLink'); if (lm) lm.remove();

  if (card.type === 'draw-first') {
    document.getElementById('drawActions').style.display = 'flex';
    document.getElementById('showBtn').style.display = 'none';
  } else {
    document.getElementById('drawActions').style.display = 'none';
  }

  const pct = (sessionIndex / currentSession.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = `${sessionIndex + 1} of ${currentSession.length}`;
}

function showAnswer() {
  document.getElementById('cardBack').classList.add('visible');
  document.getElementById('showBtn').style.display = 'none';
  document.getElementById('ratingRow').classList.add('visible');
  const card = currentSession[sessionIndex];
  renderLearnMore(card);
}

function renderLearnMore(card) {
  const existing = document.getElementById('learnMoreLink');
  if (existing) existing.remove();
  if (card && card.source_url) {
    const a = document.createElement('a');
    a.id = 'learnMoreLink';
    a.href = card.source_url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = 'learn-more';
    a.textContent = '📖 learn more';
    document.getElementById('cardContainer').appendChild(a);
  }
}

function revealDrawCard() {
  const card = currentSession[sessionIndex];
  document.getElementById('drawActions').style.display = 'none';
  document.getElementById('cardBack').classList.add('visible');
  if (card.diagram && DIAGRAMS[card.diagram]) {
    const diag = document.getElementById('drawDiagram');
    diag.style.display = 'block';
    diag.innerHTML = DIAGRAMS[card.diagram];
  }
  document.getElementById('ratingRow').classList.add('visible');
  renderLearnMore(card);
  drawRevealed = true;
}

function skipDrawCard() {
  sessionIndex++;
  showCard();
}

function rate(rating) {
  const card = currentSession[sessionIndex];
  if (sessionMode === 'review') {
    const progress = loadProgress();
    const state = getCardState(progress, card.id);
    progress[card.id] = applyRating(state, rating);
    saveProgress(progress);
  }
  sessionRatings[card.id] = rating;
  sessionDone++;
  sessionIndex++;
  showCard();
}

function showDone() {
  showScreen('done');
  const hardCount = Object.values(sessionRatings).filter(r => r === 'hard' || r === 'again').length;
  const goodCount = Object.values(sessionRatings).filter(r => r === 'good').length;
  const easyCount = Object.values(sessionRatings).filter(r => r === 'easy').length;

  document.getElementById('doneTitle').textContent = `Done! ${sessionDone} reviewed`;
  const summaryBlock = document.getElementById('simSummaryBlock');

  if (sessionMode === 'sim') {
    const sim = SIMULATORS.find(s => s.id === sessionSimId);
    const readyMsg = hardCount === 0 ? "You're ready. No hard cards." : hardCount <= 2 ? "Nearly there. A couple to revisit." : "A few gaps — review the hard ones tonight.";
    summaryBlock.innerHTML = `<div class="sim-summary">
      <h3>${sim ? sim.title : 'Simulator'} summary</h3>
      <div class="sim-stat">Cards reviewed: ${sessionDone}</div>
      <div class="sim-stat">Again/Hard: ${hardCount} &nbsp; Good: ${goodCount} &nbsp; Easy: ${easyCount}</div>
      <div class="sim-highlight">${readyMsg}</div>
    </div>`;
    document.getElementById('keepGoingBtn').style.display = 'none';
    document.getElementById('doneSubtitle').textContent = '';
  } else if (sessionMode === 'drill') {
    summaryBlock.innerHTML = '';
    document.getElementById('keepGoingBtn').style.display = 'block';
    document.getElementById('doneSubtitle').textContent = `Drill complete. Hard: ${hardCount} · Good: ${goodCount} · Easy: ${easyCount}`;
  } else {
    summaryBlock.innerHTML = '';
    document.getElementById('keepGoingBtn').style.display = 'block';
    const remaining = CARDS.filter(c => isDue(getCardState(loadProgress(), c.id))).length;
    document.getElementById('doneSubtitle').textContent = remaining > 0 ? `${remaining} cards still due today` : 'All cards reviewed for now!';
  }
}

function keepGoing() {
  if (sessionMode === 'drill' && sessionSimId) { startDrill(sessionSimId); }
  else startSession();
}

window.onload = init;
</script>
